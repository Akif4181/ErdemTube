<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f0f0f" />
<title>ErdemTube</title>
<style>
  :root {
    --bg: #0f0f0f; --bg2: #181818; --bg3: #212121;
    --fg: #f1f1f1; --fg2: #aaa; --accent: #f00; --border: #303030;
    --radius: 12px;
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh;
    padding-left: var(--safe-left); padding-right: var(--safe-right);
    overflow-x: hidden;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: calc(10px + var(--safe-top)) 20px 10px;
    background: var(--bg2); position: sticky; top: 0; z-index: 50;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .logo { font-size: 22px; font-weight: 700; color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .logo span { color: var(--accent); }
  .searchbar { flex: 1; display: flex; max-width: 600px; margin: 0 auto; min-width: 160px; }
  .searchbar input { flex: 1; padding: 10px 16px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 20px 0 0 20px; font-size: 16px; outline: none; min-width: 0; }
  .searchbar input:focus { border-color: #3ea6ff; }
  .searchbar button { padding: 10px 20px; border: 1px solid var(--border); border-left: none; background: var(--bg3); color: var(--fg); border-radius: 0 20px 20px 0; cursor: pointer; font-size: 16px; }
  .header-right select { padding: 8px 12px; background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; max-width: 200px; }

  main { padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); max-width: 1600px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { cursor: pointer; border-radius: var(--radius); overflow: hidden; background: var(--bg2); transition: transform .15s; }
  .card:hover { transform: scale(1.02); }
  .card-thumb { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  /* aspect-ratio desteklemeyen tarayıcılar için fallback */
  @supports not (aspect-ratio: 16/9) {
    .card-thumb { height: 0; padding-top: 56.25%; }
    .card-thumb img { position: absolute; top: 0; left: 0; }
    .rec-thumb { height: 0; padding-top: 56.25%; position: relative; }
    .rec-thumb img { position: absolute; top: 0; left: 0; }
    .player-wrap { height: 0; padding-top: 56.25%; }
    .player-wrap video, .player-wrap .player-loading, .player-wrap .glass-play-overlay, .player-wrap .glass-controls, .player-wrap .glass-menu { position: absolute; }
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.85); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .card-info { padding: 12px; }
  .card-title { font-weight: 500; font-size: 14px; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-channel { font-size: 13px; color: var(--fg2); }
  .card-meta { font-size: 12px; color: var(--fg2); margin-top: 2px; }

  .watch-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
  @media (max-width: 1100px) { .watch-layout { grid-template-columns: 1fr; } }
  .video-title { font-size: 20px; font-weight: 600; margin: 16px 0 8px; word-break: break-word; }
  .video-meta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--fg2); font-size: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .channel-row { display: flex; align-items: center; gap: 12px; padding: 16px 0; }
  .channel-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg3); object-fit: cover; }
  .channel-name { font-weight: 500; font-size: 15px; }
  .channel-subs { font-size: 12px; color: var(--fg2); }
  .desc-box { background: var(--bg2); padding: 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .recs { display: flex; flex-direction: column; gap: 12px; }
  .rec { display: flex; gap: 12px; cursor: pointer; border-radius: 8px; padding: 4px; }
  .rec:hover { background: var(--bg2); }
  .rec-thumb { width: 160px; min-width: 160px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
  .rec-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec-info { flex: 1; min-width: 0; }
  .rec-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rec-channel { font-size: 12px; color: var(--fg2); }
  .empty { text-align: center; padding: 80px 20px; color: var(--fg2); }
  .error { color: #ff6b6b; padding: 20px; background: rgba(255,0,0,.1); border-radius: var(--radius); margin: 20px 0; }
  .toast { position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }

  .player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); user-select: none; -webkit-user-select: none; }
  .player-wrap video { width: 100%; height: 100%; display: block; background: #000; }
  .player-wrap.controls-visible { cursor: default; }
  .player-wrap:not(.controls-visible) { cursor: none; }

  .player-loading { position: absolute; inset: 0; top:0; right:0; bottom:0; left:0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.7); color: #fff; font-size: 14px; z-index: 30; gap: 12px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .glass-play-overlay { position: absolute; inset: 0; top:0; right:0; bottom:0; left:0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(0,0,0,.2) 0%, rgba(0,0,0,.5) 100%); z-index: 15; cursor: pointer; transition: opacity .3s; }
  .glass-play-overlay.hidden { opacity: 0; pointer-events: none; }
  .glass-big-play { width: 84px; height: 84px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; color: #fff; transition: transform .2s, background .2s; }
  .glass-big-play:hover { transform: scale(1.08); background: rgba(255,255,255,.16); }
  .glass-big-play svg { width: 36px; height: 36px; margin-left: 4px; }

  .glass-controls { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(20,20,20,.35); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.15); z-index: 20; transform: translateY(20px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  .player-wrap.controls-visible .glass-controls { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; position: relative; cursor: pointer; border-radius: 3px; background: rgba(255,255,255,.2); padding: 8px 0; margin: -8px 0; }
  .progress-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%); border-radius: 3px; background: rgba(255,255,255,.2); }
  .progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 6px; border-radius: 3px; background: #fff; pointer-events: none; width: 0%; }
  .progress-buffer { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); pointer-events: none; width: 0%; }
  .progress-knob { position: absolute; top: 50%; width: 14px; height: 14px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(0); pointer-events: none; transition: transform .15s; box-shadow: 0 0 0 4px rgba(255,255,255,.2); }
  .progress-bar:hover .progress-knob { transform: translate(-50%, -50%) scale(1); }
  .time-label { font-size: 12px; color: #fff; opacity: .9; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .ctrl-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .ctrl-btn { width: 36px; height: 36px; border: none; background: transparent; color: #fff; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; padding: 0; }
  .ctrl-btn:hover { background: rgba(255,255,255,.14); }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .ctrl-spacer { flex: 1; }

  .volume-wrap { display: flex; align-items: center; gap: 6px; }
  .volume-slider { width: 0; overflow: hidden; transition: width .2s; display: flex; align-items: center; }
  .volume-wrap:hover .volume-slider, .volume-wrap:focus-within .volume-slider { width: 80px; }
  .volume-slider input { width: 80px; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; outline: none; }
  .volume-slider input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }
  .volume-slider input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; border: none; }

  .glass-menu { position: absolute; right: 12px; bottom: 90px; min-width: 220px; max-height: 380px; overflow-y: auto; -webkit-overflow-scrolling: touch; background: rgba(20,20,20,.6); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 14px; box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.15); z-index: 25; padding: 8px; display: none; }
  .glass-menu.open { display: block; }
  .glass-menu h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .55; padding: 8px 10px 4px; font-weight: 600; }
  .glass-menu-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 8px; transition: background .12s; }
  .glass-menu-item:hover { background: rgba(255,255,255,.12); }
  .glass-menu-item.selected { background: rgba(62,166,255,.25); }
  .glass-menu-item.selected::after { content: "✓"; margin-left: auto; color: #3ea6ff; font-weight: 700; }
  .glass-menu-divider { height: 1px; background: rgba(255,255,255,.1); margin: 6px 4px; }

  video::cue { background: rgba(0,0,0,.75); color: #fff; font-family: "Roboto", sans-serif; font-size: 20px; text-shadow: 0 1px 3px rgba(0,0,0,.9); padding: 4px 8px; }

  /* ============ CİHAZ / OS UYUM KURALLARI ============ */

  /* backdrop-filter desteklenmiyorsa düz arka plan */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass-big-play, .glass-controls, .glass-menu { background: rgba(20,20,20,.92) !important; }
  }

  /* Dokunmatik cihazlarda hover yerine aktif */
  @media (hover: none) {
    .volume-slider { width: 60px; }
    .volume-wrap:hover .volume-slider { width: 60px; }
    .card:hover { transform: none; }
    .card:active { transform: scale(1.01); }
  }

  /* Küçük ekranlar (telefonlar) */
  @media (max-width: 700px) {
    header { gap: 10px; padding-left: 12px; padding-right: 12px; }
    .logo { font-size: 19px; }
    .searchbar { order: 3; flex-basis: 100%; max-width: 100%; margin: 0; }
    .header-right { margin-left: auto; }
    .header-right select { max-width: 130px; font-size: 13px; }
    main { padding: 12px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card-info { padding: 8px; }
    .card-title { font-size: 13px; }
    .watch-layout { gap: 14px; }
    .video-title { font-size: 16px; }
    .player-wrap { border-radius: 8px; }
    .glass-controls { left: 6px; right: 6px; bottom: 6px; padding: 6px 8px; border-radius: 10px; }
    .ctrl-btn { width: 32px; height: 32px; }
    .ctrl-btn svg { width: 18px; height: 18px; }
    .glass-menu { right: 6px; bottom: 70px; min-width: 180px; max-height: 300px; }
    .rec-thumb { width: 120px; min-width: 120px; }
    .time-label { font-size: 11px; }
    .desc-box { font-size: 13px; padding: 12px; }
  }

  /* Çok küçük ekranlar (iPhone 4S, eski Android) */
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .logo { font-size: 17px; }
    .searchbar input { padding: 8px 12px; }
    .searchbar button { padding: 8px 14px; }
    .video-title { font-size: 15px; }
    .glass-big-play { width: 60px; height: 60px; }
    .glass-big-play svg { width: 26px; height: 26px; }
    .rec { flex-direction: row; }
    .rec-thumb { width: 100px; min-width: 100px; }
    .volume-slider { width: 0; }
    .volume-wrap:hover .volume-slider, .volume-wrap:focus-within .volume-slider { width: 60px; }
  }

  /* ============ iPhone 4S / Çok Eski iOS ÖZEL ============ */
  /* iPhone 4S: 320x480 CSS px, iOS 9 max, backdrop-filter yok, aspect-ratio yok */
  [data-device="iphone4s"] .glass-big-play,
  [data-device="iphone4s"] .glass-controls,
  [data-device="iphone4s"] .glass-menu {
    background: rgba(20,20,20,.94) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  [data-device="iphone4s"] .player-wrap {
    border-radius: 4px;
    box-shadow: none;
    /* aspect-ratio fallback */
    height: 0;
    padding-top: 56.25%;
  }
  [data-device="iphone4s"] .player-wrap > * {
    position: absolute;
  }
  [data-device="iphone4s"] video {
    object-fit: contain;
  }
  [data-device="iphone4s"] .grid {
    grid-template-columns: 1fr !important;
    gap: 8px;
  }
  [data-device="iphone4s"] header {
    padding: 6px 8px;
    gap: 6px;
  }
  [data-device="iphone4s"] .logo { font-size: 15px; }
  [data-device="iphone4s"] .searchbar { order: 3; flex-basis: 100%; }
  [data-device="iphone4s"] .searchbar input { font-size: 13px; padding: 7px 10px; }
  [data-device="iphone4s"] .searchbar button { font-size: 13px; padding: 7px 12px; }
  [data-device="iphone4s"] .header-right select { font-size: 12px; padding: 6px 8px; max-width: 110px; }
  [data-device="iphone4s"] main { padding: 8px; }
  [data-device="iphone4s"] .card-info { padding: 6px; }
  [data-device="iphone4s"] .card-title { font-size: 12px; -webkit-line-clamp: 3; }
  [data-device="iphone4s"] .card-channel, [data-device="iphone4s"] .card-meta { font-size: 11px; }
  [data-device="iphone4s"] .video-title { font-size: 14px; margin: 8px 0 4px; }
  [data-device="iphone4s"] .video-meta-row { font-size: 12px; gap: 8px; padding-bottom: 8px; }
  [data-device="iphone4s"] .channel-row { padding: 8px 0; gap: 8px; }
  [data-device="iphone4s"] .channel-avatar { width: 32px; height: 32px; }
  [data-device="iphone4s"] .channel-name { font-size: 13px; }
  [data-device="iphone4s"] .channel-subs { font-size: 11px; }
  [data-device="iphone4s"] .desc-box { font-size: 12px; padding: 10px; line-height: 1.4; }
  [data-device="iphone4s"] .rec-thumb { width: 90px; min-width: 90px; }
  [data-device="iphone4s"] .rec-title { font-size: 12px; }
  [data-device="iphone4s"] .rec-channel { font-size: 11px; }
  [data-device="iphone4s"] .glass-controls {
    left: 4px; right: 4px; bottom: 4px;
    padding: 4px 6px; border-radius: 8px; gap: 4px;
  }
  [data-device="iphone4s"] .ctrl-btn { width: 28px; height: 28px; }
  [data-device="iphone4s"] .ctrl-btn svg { width: 16px; height: 16px; }
  [data-device="iphone4s"] .time-label { font-size: 10px; }
  [data-device="iphone4s"] .progress-bar { height: 4px; }
  [data-device="iphone4s"] .progress-fill, [data-device="iphone4s"] .progress-buffer, [data-device="iphone4s"] .progress-bar::before { height: 4px; }
  [data-device="iphone4s"] .progress-knob { width: 10px; height: 10px; }
  [data-device="iphone4s"] .glass-big-play { width: 52px; height: 52px; }
  [data-device="iphone4s"] .glass-big-play svg { width: 22px; height: 22px; }
  [data-device="iphone4s"] .glass-menu { right: 4px; bottom: 56px; min-width: 150px; max-height: 240px; padding: 4px; }
  [data-device="iphone4s"] .glass-menu-item { padding: 7px 8px; font-size: 12px; }
  [data-device="iphone4s"] .volume-slider, [data-device="iphone4s"] .volume-wrap:hover .volume-slider { width: 0 !important; }
  [data-device="iphone4s"] .toast { font-size: 12px; padding: 8px 14px; }

  /* macOS / Windows / Linux için ince ayarlar (hover'lı cihazlar) */
  [data-os="macos"] body, [data-os="windows"] body, [data-os="linux"] body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  [data-os="macos"] .ctrl-btn:hover, [data-os="windows"] .ctrl-btn:hover, [data-os="linux"] .ctrl-btn:hover { background: rgba(255,255,255,.18); }

  /* Android için dokunma vurgusu kapalı, overscroll yumuşatma */
  [data-os="android"] { overscroll-behavior-y: contain; }
  [data-os="android"] .glass-menu { -webkit-overflow-scrolling: touch; }

  /* Eski cihazlarda animasyonları azalt */
  [data-legacy="true"] *, [data-legacy="true"] *::before, [data-legacy="true"] *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
  [data-legacy="true"] .spinner { animation: spin 1s linear infinite !important; }

  /* Erişilebilirlik: reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* Yazdırma */
  @media print { header, .player-wrap, .recs { display: none; } }
</style>
</head>
<body>

<header>
  <a href="#/" class="logo" onclick="App.goHome(event)">Erdem<span>Tube</span></a>
  <div class="searchbar">
    <input id="searchInput" placeholder="Ara veya video linki yapıştır..." onkeydown="if(event.key==='Enter')App.search()" />
    <button onclick="App.search()">🔍</button>
  </div>
  <div class="header-right">
    <select id="instanceSelect" onchange="App.changeInstance(this.value)"></select>
  </div>
</header>

<main>
  <div id="view-home" class="view active">
    <h2 style="margin-bottom:16px;font-weight:500;">Popüler</h2>
    <div id="homeGrid" class="grid"></div>
    <div id="homeEmpty" class="empty" style="display:none;">Yükleniyor...</div>
  </div>

  <div id="view-search" class="view">
    <h2 id="searchTitle" style="margin-bottom:16px;font-weight:500;"></h2>
    <div id="searchGrid" class="grid"></div>
    <div id="searchEmpty" class="empty" style="display:none;">Sonuç bulunamadı.</div>
  </div>

  <div id="view-watch" class="view">
    <div class="watch-layout">
      <div>
        <div id="playerWrap" class="player-wrap">
          <video id="video" playsinline webkit-playsinline preload="metadata" crossorigin="anonymous"></video>

          <div id="playerLoading" class="player-loading" style="display:none;">
            <div class="spinner"></div>
            <span>Yükleniyor...</span>
          </div>

          <div id="glassPlayOverlay" class="glass-play-overlay hidden">
            <div class="glass-big-play">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>

          <div id="glassControls" class="glass-controls">
            <div class="progress-row">
              <span class="time-label" id="timeCurrent">0:00</span>
              <div class="progress-bar" id="progressBar">
                <div class="progress-buffer" id="progressBuffer"></div>
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-knob" id="progressKnob"></div>
              </div>
              <span class="time-label" id="timeDuration">0:00</span>
            </div>
            <div class="ctrl-row">
              <button class="ctrl-btn" id="btnPlay" title="Oynat/Duraklat">
                <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnSkipBack" title="10s geri">

<script>
(function(){
  // ===== CİHAZ TESPİTİ (ES5 uyumlu, tüm cihazlarda çalışır) =====
  var Device = (function(){
    var ua = navigator.userAgent || '';
    var platform = navigator.platform || '';
    var maxTouch = navigator.maxTouchPoints || 0;
    var os = 'unknown', device = 'desktop', legacy = false;

    // OS tespiti
    if (/iPhone|iPod/.test(ua)) { os = 'ios'; }
    else if (/iPad/.test(ua) || (platform === 'MacIntel' && maxTouch > 1)) { os = 'ios'; }
    else if (/Android/.test(ua)) { os = 'android'; }
    else if (/Mac OS X|Macintosh/.test(ua)) { os = 'macos'; }
    else if (/Windows/.test(ua)) { os = 'windows'; }
    else if (/Linux/.test(ua)) { os = 'linux'; }
    else if (/CrOS/.test(ua)) { os = 'chromeos'; }

    // iPhone 4S tespiti: iPhone + 320x480 ekran + eski iOS (5/6/7/8/9) + devicePixelRatio=1
    var isIPhone = /iPhone/.test(ua);
    var screenW = window.screen ? window.screen.width : 0;
    var screenH = window.screen ? window.screen.height : 0;
    var minSide = Math.min(screenW, screenH);
    var maxSide = Math.max(screenW, screenH);
    var dpr = window.devicePixelRatio || 1;
    // iPhone 4S: 320x480 CSS px, dpr genelde 2 (Retina), A5, iOS max 9.3.6
    var isIPhone4S = isIPhone && minSide === 320 && maxSide === 480 && dpr >= 2;

    // Eski cihaz tespiti
    var iosVersion = 0;
    var m = ua.match(/OS (\d+)_/);
    if (m) iosVersion = parseInt(m[1], 10);
    if (os === 'ios' && iosVersion > 0 && iosVersion <= 9) legacy = true;
    if (os === 'android') {
      var am = ua.match(/Android (\d+)/);
      if (am && parseInt(am[1], 10) <= 5) legacy = true;
    }
    if (!window.Promise || !window.fetch) legacy = true;

    // Cihaz sınıfı
    if (isIPhone4S) device = 'iphone4s';
    else if (os === 'ios' && isIPhone) device = 'iphone';
    else if (os === 'ios') device = 'ipad';
    else if (os === 'android') device = 'android';
    else if (os === 'macos') device = 'mac';
    else if (os === 'windows') device = 'windows';
    else if (os === 'linux') device = 'linux';

    // body'ye nitelik ekle
    var body = document.body;
    body.setAttribute('data-os', os);
    body.setAttribute('data-device', device);
    body.setAttribute('data-legacy', legacy ? 'true' : 'false');

    return {
      os: os, device: device, legacy: legacy,
      isMobile: /iPhone|iPad|iPod|Android/.test(ua) || (platform === 'MacIntel' && maxTouch > 1),
      isIPhone4S: isIPhone4S,
      iosVersion: iosVersion,
      supportsBackdrop: (function(){
        var d = document.createElement('div');
        return ('backdropFilter' in d.style) || ('webkitBackdropFilter' in d.style);
      })(),
      supportsAspectRatio: (function(){
        var d = document.createElement('div');
        return 'aspectRatio' in d.style || (function(){ try { d.style.aspectRatio = '1/1'; return d.style.aspectRatio !== ''; } catch(e){ return false; } })();
      })(),
      screenW: screenW, screenH: screenH, dpr: dpr
    };
  })();

  // ===== POLYFILL'ler (eski tarayıcılar için) =====
  // Array.from
  if (!Array.from) {
    Array.from = function(arrayLike) {
      var arr = [];
      var len = arrayLike.length || 0;
      for (var i = 0; i < len; i++) arr.push(arrayLike[i]);
      return arr;
    };
  }
  // Object.assign
  if (typeof Object.assign !== 'function') {
    Object.assign = function(target) {
      for (var i = 1; i < arguments.length; i++) {
        var src = arguments[i];
        if (src) for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) target[k] = src[k];
      }
      return target;
    };
  }
  // Element.prototype.remove
  if (!Element.prototype.remove) {
    Element.prototype.remove = function() { if (this.parentNode) this.parentNode.removeChild(this); };
  }
  // Element.prototype.matches
  if (!Element.prototype.matches) {
    Element.prototype.matches = Element.prototype.msMatchesSelector || Element.prototype.webkitMatchesSelector;
  }
  // closest
  if (!Element.prototype.closest) {
    Element.prototype.closest = function(sel) {
      var el = this;
      while (el && el.nodeType === 1) {
        if (el.matches(sel)) return el;
        el = el.parentElement || el.parentNode;
      }
      return null;
    };
  }
  // String.prototype.startsWith
  if (!String.prototype.startsWith) {
    String.prototype.startsWith = function(search, pos) {
      pos = pos || 0;
      return this.indexOf(search, pos) === pos;
    };
  }
  // Intl.NumberFormat fallback
  if (typeof Intl === 'undefined') {
    window.Intl = {};
  }
  if (!Intl.NumberFormat) {
    Intl.NumberFormat = function() {
      return { format: function(n) {
        if (n == null || isNaN(n)) return '';
        n = Number(n);
        if (n >= 1e9) return (n/1e9).toFixed(1).replace('.0','') + 'B';
        if (n >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + 'M';
        if (n >= 1e3) return (n/1e3).toFixed(1).replace('.0','') + 'B';
        return String(n);
      }};
    };
  }
  // fetch fallback (XHR tabanlı basit)
  if (!window.fetch) {
    window.fetch = function(url, opts) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open((opts && opts.method) || 'GET', url, true);
        xhr.onload = function() {
          var body = xhr.responseText;
          var ok = xhr.status >= 200 && xhr.status < 300;
          resolve({
            ok: ok, status: xhr.status, statusText: xhr.statusText,
            text: function(){ return Promise.resolve(body); },
            json: function(){ try { return Promise.resolve(JSON.parse(body)); } catch(e){ return Promise.reject(e); } }
          });
        };
        xhr.onerror = function(){ reject(new Error('Network error')); };
        xhr.send((opts && opts.body) || null);
      });
    };
  }
  // Promise fallback yoksa çok basit bir micro polyfill (çok eski cihazlar için)
  if (!window.Promise) {
    // Çok basit Promise polyfill — gerçek Promise değil, sadece zincirleme için
    (function(){
      function P(fn){ var self = this; self._cbs = []; self._state = 0; self._val = null;
        function res(v){ if(self._state) return; self._state = 1; self._val = v; self._cbs.forEach(function(cb){ setTimeout(function(){ cb.res(v); }, 0); }); }
        function rej(e){ if(self._state) return; self._state = 2; self._val = e; self._cbs.forEach(function(cb){ setTimeout(function(){ cb.rej(e); }, 0); }); }
        try { fn(res, rej); } catch(e){ rej(e); }
      }
      P.prototype.then = function(onF, onR){ var self = this; return new P(function(res, rej){
        function go(){ if(self._state === 1){ if(onF){ try{ var r = onF(self._val); if(r && r.then) r.then(res, rej); else res(r); } catch(e){ rej(e); } } else res(self._val); }
          else if(self._state === 2){ if(onR) onR(self._val); else rej(self._val); }
          else { self._cbs.push({ res: res, rej: rej, onF: onF, onR: onR }); } }
        setTimeout(go, 0);
      }); };
      P.prototype.catch = function(fn){ return this.then(null, fn); };
      P.resolve = function(v){ return new P(function(res){ res(v); }); };
      P.reject = function(e){ return new P(function(res, rej){ rej(e); }); };
      P.all = function(arr){ return new P(function(res, rej){ var out = [], left = arr.length; if(!left) return res(out); arr.forEach(function(p, i){ P.resolve(p).then(function(v){ out[i] = v; if(--left === 0) res(out); }, rej); }); }); };
      window.Promise = P;
    })();
  }

  // ===== Şimdi App'i başlat =====
  // Device bilgisini global yap
  window.Device = Device;

  // iPhone 4S'te Shaka yükleme (yavaş cihaz, gereksiz)
  if (!Device.isIPhone4S && !Device.legacy) {
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js';
    script.async = true;
    script.onerror = function(){ console.warn('Shaka Player yüklenemedi, native oynatıcı kullanılacak.'); };
    document.head.appendChild(script);
  } else {
    console.log('[ErdemTube] Eski cihaz / iPhone 4S: Shaka Player atlandı, native video kullanılacak.');
  }
})();
</script>

<script>
// ===== ANA UYGULAMA =====
var App = (function() {
  var state = {
    instances: [],
    currentInstance: '',
    currentInstanceUrl: '',
    currentVideo: null,
    shakaPlayer: null,
    captionTracks: [],
    activeCaptionId: 'off',
    variants: [],
    currentQuality: 'auto',
    blobUrls: [],
    audioTracks: [],
    activeAudioId: null,
  };

  var audioSyncEl = null;

  // ===== UTILS =====
  function randomArrayItem(a){ return a[Math.floor(Math.random()*a.length)]; }
  function formatNumber(n){
    if(n==null||isNaN(n))return'';
    try { return new Intl.NumberFormat('tr-TR', { notation: 'compact' }).format(n); }
    catch(e) { return String(n); }
  }
  function formatDuration(s){
    if(!s||s<0||!isFinite(s))return'0:00';
    var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
    return h>0 ? (h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')) : (m+':'+String(sec).padStart(2,'0'));
  }
  function timeAgo(ms){
    if(!ms)return'';
    var d=Date.now()-ms;
    var days=Math.floor(d/86400000);
    if(days<1)return'bugün';
    if(days<7)return days+' gün önce';
    if(days<30)return Math.floor(days/7)+' hafta önce';
    if(days<365)return Math.floor(days/30)+' ay önce';
    return Math.floor(days/365)+' yıl önce';
  }
  function showToast(msg,d){
    d = d || 3000;
    var t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t=setTimeout(function(){ t.classList.remove('show'); },d);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function absolutizeUrl(url){
    if(!url)return'';
    if(url.indexOf('http')===0)return url;
    return state.currentInstanceUrl+url;
  }
  function extractVideoId(input){
    if(!input)return null;
    if(/^[\w-]{11}$/.test(input))return input;
    try{
      var u=new URL(input);
      if(u.hostname.indexOf('youtu.be')!==-1)return u.pathname.slice(1);
      if(u.searchParams.get('v'))return u.searchParams.get('v');
    }catch(e){}
    return null;
  }
  function cleanupBlobs(){
    state.blobUrls.forEach(function(u){ try{URL.revokeObjectURL(u);}catch(e){} });
    state.blobUrls = [];
  }

  // ===== INSTANCES =====
  function fetchInvidiousInstances(){
    return fetch('./invidious-instances.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        state.instances = data.filter(function(i){ return i.cors; }).map(function(i){ return i.url; });
      })
      .catch(function(err){
        console.warn('instances.json yüklenemedi', err);
        state.instances = ['https://yt.chocolatemoo53.com'];
      })
      .then(function(){
        if(state.instances.length===0) state.instances = ['https://yt.chocolatemoo53.com'];
        var sel = document.getElementById('instanceSelect');
        sel.innerHTML = state.instances.map(function(u){
          var host=''; try{host=new URL(u).hostname;}catch(e){host=u;}
          return '<option value="'+u+'">'+host+'</option>';
        }).join('');
        setRandomCurrentInvidiousInstance();
      });
  }
  function setRandomCurrentInvidiousInstance(){
    setCurrentInvidiousInstance(randomArrayItem(state.instances));
  }
  function setCurrentInvidiousInstance(url){
    state.currentInstance = url;
    var parsed;
    try{ parsed = new URL(url); }catch(e){ parsed = null; }
    var instanceUrl = url;
    if(parsed && (parsed.username||parsed.password)){
      parsed.username=''; parsed.password='';
      instanceUrl = parsed.toString().replace(/\/$/,'');
    }
    state.currentInstanceUrl = instanceUrl.replace(/\/$/,'');
    var sel = document.getElementById('instanceSelect'); if(sel) sel.value = url;
  }
  function changeInstance(url){
    setCurrentInvidiousInstance(url);
    var host=''; try{ host=new URL(url).hostname; }catch(e){ host=url; }
    showToast('Instance: '+host);
    loadHome();
  }

  // ===== INVIDIOUS API =====
  function invidiousGetVideoInformation(videoId){
    var url = state.currentInstanceUrl+'/api/v1/videos/'+videoId;
    return fetch(url).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    });
  }
  function invidiousSearch(q){
    var url = state.currentInstanceUrl+'/api/v1/search?q='+encodeURIComponent(q)+'&type=video';
    return fetch(url).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    });
  }
  function invidiousTrending(){
    var url = state.currentInstanceUrl+'/api/v1/trending?region=TR';
    return fetch(url).then(function(res){
      if(!res.ok){
        var url2 = state.currentInstanceUrl+'/api/v1/trending?region=US';
        return fetch(url2).then(function(res2){
          if(!res2.ok) return [];
          return res2.json();
        });
      }
      return res.json();
    });
  }

  // ===== VIEW =====
  function showView(name){
    var views = document.querySelectorAll('.view');
    for(var i=0;i<views.length;i++) views[i].classList.remove('active');
    document.getElementById('view-'+name).classList.add('active');
    window.scrollTo(0,0);
  }
  function goHome(e){ if(e)e.preventDefault(); location.hash='#/'; }

  // ===== HOME =====
  function loadHome(){
    showView('home');
    var grid=document.getElementById('homeGrid'), empty=document.getElementById('homeEmpty');
    grid.innerHTML='<div class="empty">Yükleniyor...</div>'; empty.style.display='none';
    invidiousTrending().then(function(items){
      if(!items||items.length===0){
        grid.innerHTML='';
        empty.textContent='Trendler bu instance\'ta boş. Arama yapmayı dene.';
        empty.style.display='block';
        return;
      }
      var filtered = items.filter(function(i){ return i.type==='video'||i.videoId; }).slice(0,24);
      var html = '';
      for(var i=0;i<filtered.length;i++) html += renderCard(filtered[i]);
      grid.innerHTML = html;
    }).catch(function(err){
      grid.innerHTML='';
      empty.textContent='Trendler yüklenemedi: '+err.message;
      empty.style.display='block';
    });
  }
  function renderCard(item){
    var vid=item.videoId, title=escapeHtml(item.title||''), author=escapeHtml(item.author||'');
    var dur=formatDuration(item.lengthSeconds);
    var views=item.viewCount!=null ? formatNumber(item.viewCount)+' görüntülenme' : '';
    var thumb=(item.videoThumbnails&&item.videoThumbnails[0]&&item.videoThumbnails[0].url)||('https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg');
    return '<div class="card" onclick="location.hash=\'#/watch/'+vid+'\'">'+
      '<div class="card-thumb">'+
        '<img src="'+thumb+'" loading="lazy" alt="" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg\'"/>'+
        (dur?'<span class="duration">'+dur+'</span>':'')+
      '</div>'+
      '<div class="card-info">'+
        '<div class="card-title">'+title+'</div>'+
        '<div class="card-channel">'+author+'</div>'+
        '<div class="card-meta">'+views+'</div>'+
      '</div>'+
    '</div>';
  }

  // ===== SEARCH =====
  function search(){
    var q = document.getElementById('searchInput').value.trim();
    if(!q) return;
    var vid = extractVideoId(q);
    if(vid){ location.hash='#/watch/'+vid; return; }
    showView('search');
    document.getElementById('searchTitle').textContent = '"'+q+'" için sonuçlar';
    var grid=document.getElementById('searchGrid'), empty=document.getElementById('searchEmpty');
    grid.innerHTML='<div class="empty">Aranıyor...</div>'; empty.style.display='none';
    invidiousSearch(q).then(function(items){
      var videos = (items||[]).filter(function(i){ return i.type==='video'||i.videoId; });
      if(videos.length===0){ grid.innerHTML=''; empty.textContent='Sonuç bulunamadı.'; empty.style.display='block'; return; }
      var html = '';
      for(var i=0;i<Math.min(videos.length,40);i++) html += renderCard(videos[i]);
      grid.innerHTML = html;
    }).catch(function(err){
      grid.innerHTML=''; empty.textContent='Arama hatası: '+err.message; empty.style.display='block';
    });
  }

  // ===== WATCH =====
  function loadWatch(videoId){
    showView('watch');
    resetWatchUI();
    var loading = document.getElementById('playerLoading');
    loading.style.display='flex';

    invidiousGetVideoInformation(videoId).then(function(result){
      if(result.error) throw new Error(result.error);
      state.currentVideo = result;

      document.getElementById('videoTitle').textContent = result.title||'';
      document.getElementById('viewCount').textContent = result.viewCount!=null ? formatNumber(result.viewCount)+' görüntülenme' : '';
      document.getElementById('publishDate').textContent = result.published ? timeAgo(result.published*1000) : '';
      document.getElementById('likeCount').textContent = result.likeCount!=null ? formatNumber(result.likeCount)+' beğeni' : '';
      var avatar = (result.authorThumbnails&&result.authorThumbnails[1]&&result.authorThumbnails[1].url)||'';
      document.getElementById('channelAvatar').src = avatar?absolutizeUrl(avatar):'';
      document.getElementById('channelName').textContent = result.author||'';
      var subCount = result.subCount!=null ? formatNumber(result.subCount) : '';
      document.getElementById('channelSubs').textContent = subCount ? subCount+' abone' : '';
      document.getElementById('description').textContent = result.description||'';

      var recs = document.getElementById('recs');
      var recHtml = '';
      var recList = (result.recommendedVideos||[]).slice(0,15);
      for(var i=0;i<recList.length;i++){
        var r = recList[i];
        recHtml += '<div class="rec" onclick="location.hash=\'#/watch/'+r.videoId+'\'">'+
          '<div class="rec-thumb">'+
            (r.videoThumbnails&&r.videoThumbnails[0]&&r.videoThumbnails[0].url?'<img src="'+r.videoThumbnails[0].url+'" loading="lazy" alt=""/>':'')+
          '</div>'+
          '<div class="rec-info">'+
            '<div class="rec-title">'+escapeHtml(r.title||'')+'</div>'+
            '<div class="rec-channel">'+escapeHtml(r.author||'')+'</div>'+
          '</div>'+
        '</div>';
      }
      recs.innerHTML = recHtml;

      document.title = (result.title||'ErdemTube')+' - ErdemTube';

      return setupPlayer(result);
    }).then(function(){
      loading.style.display='none';
    }).catch(function(err){
      console.error(err);
      loading.style.display='none';
      var errBox = document.getElementById('watchError');
      errBox.textContent = 'Video yüklenemedi: '+err.message;
      errBox.style.display='block';
    });

  // ===== PLAYER =====
  function setupPlayer(videoInfo){
    var videoEl = document.getElementById('video');
    var chain = Promise.resolve();

    // Temizlik
    if(state.shakaPlayer){
      chain = chain.then(function(){
        return state.shakaPlayer.destroy().catch(function(){});
      }).then(function(){
        state.shakaPlayer = null;
      });
    }
    return chain.then(function(){
      videoEl.pause();
      videoEl.removeAttribute('src');
      var sources = videoEl.querySelectorAll('source');
      for(var i=0;i<sources.length;i++) sources[i].remove();
      var tracks = videoEl.querySelectorAll('track');
      for(var j=0;j<tracks.length;j++) tracks[j].remove();
      videoEl.load();

      if(audioSyncEl){ try{audioSyncEl.pause();audioSyncEl.remove();}catch(e){} audioSyncEl = null; }

      cleanupBlobs();
      state.captionTracks = [];
      state.variants = [];
      state.currentQuality = 'auto';
      state.activeCaptionId = 'off';
      state.audioTracks = [];
      state.activeAudioId = null;

      var fallback = buildFallbackUrl(videoInfo);

      // iPhone 4S / eski cihaz: doğrudan combined MP4 veya adaptive
      if(window.Device && (window.Device.isIPhone4S || window.Device.legacy)){
        return playLegacy(videoInfo, fallback);
      }

      // Modern: DASH → HLS → adaptive → combined
      var dashUrl = state.currentInstanceUrl+'/api/manifest/dash/id/'+videoInfo.videoId+'?local=true';
      return loadWithShaka(dashUrl, 'application/dash+xml').then(function(){
        console.log('[Player] DASH yüklendi ✅');
        state.variants = state.shakaPlayer.getVariantTracks();
        buildQualityList(state.variants);
        return finishPlayerSetup(videoInfo);
      }).catch(function(err){
        console.warn('[Player] DASH başarısız:', err.message);
        if(videoInfo.hlsUrl){
          return loadWithShaka(videoInfo.hlsUrl, 'application/x-mpegurl').then(function(){
            console.log('[Player] HLS yüklendi ✅');
            state.variants = state.shakaPlayer ? state.shakaPlayer.getVariantTracks() : [];
            buildQualityList(state.variants);
            return finishPlayerSetup(videoInfo);
          });
        }
        throw err;
      }).catch(function(err){
        console.warn('[Player] HLS başarısız:', err.message);
        if(fallback.videoUrl){
          videoEl.src = fallback.videoUrl;
          videoEl.muted = false;
          if(fallback.audioUrl) attachAudioTrack(fallback.audioUrl);
          return videoEl.play().catch(function(){}).then(function(){
            console.log('[Player] Adaptive (video+audio ayrı) yüklendi ✅');
            buildQualityList([]);
            return finishPlayerSetup(videoInfo);
          });
        }
        throw err;
      }).catch(function(err){
        console.warn('[Player] adaptive fallback başarısız:', err.message);
        var combined = (videoInfo.formatStreams||[]).filter(function(f){return f.itag==='18';})[0] || (videoInfo.formatStreams||[])[0];
        if(combined && combined.url){
          videoEl.src = absolutizeUrl(combined.url);
          return videoEl.play().catch(function(){}).then(function(){
            console.log('[Player] Combined MP4 yüklendi ✅');
            buildQualityList([]);
            return finishPlayerSetup(videoInfo);
          });
        }
        throw new Error('Hiçbir format oynatılamadı.');
      });
    });
  }

  // Eski cihazlar / iPhone 4S için basit oynatıcı
  function playLegacy(videoInfo, fallback){
    var videoEl = document.getElementById('video');
    var combined = (videoInfo.formatStreams||[]).filter(function(f){return f.itag==='18';})[0] || (videoInfo.formatStreams||[])[0];

    if(fallback.videoUrl){
      videoEl.src = fallback.videoUrl;
      videoEl.muted = false;
      if(fallback.audioUrl) attachAudioTrack(fallback.audioUrl);
      return videoEl.play().catch(function(){}).then(function(){
        buildQualityList([]);
        return finishPlayerSetup(videoInfo);
      });
    }
    if(combined && combined.url){
      videoEl.src = absolutizeUrl(combined.url);
      return videoEl.play().catch(function(){}).then(function(){
        buildQualityList([]);
        return finishPlayerSetup(videoInfo);
      });
    }
    throw new Error('Oynatılabilir format yok.');
  }

  function loadWithShaka(url, mime){
    if(!window.shaka || !shaka.Player || !shaka.Player.isBrowserSupported()){
      return Promise.reject(new Error('Shaka yok'));
    }
    shaka.polyfill.installAll();
    var videoEl = document.getElementById('video');
    var player = new shaka.Player();
    return player.attach(videoEl).then(function(){
      player.addEventListener('error', function(e){ console.error('Shaka error:', e.detail); });
      return player.load(url, null, mime);
    }).then(function(){
      state.shakaPlayer = player;
    });
  }

  function buildFallbackUrl(videoInfo){
    var adaptive = videoInfo.adaptiveFormats || [];
    var videoUrl = null;
    var videos = adaptive.filter(function(f){ return (f.type||'').indexOf('video/mp4')===0; });
    if(videos.length){
      var best = videos.sort(function(a,b){return parseInt(b.bitrate||0)-parseInt(a.bitrate||0);})[0];
      videoUrl = absolutizeUrl(best.url);
    }
    var audioUrl = null;
    var audios = adaptive.filter(function(f){ return (f.type||'').indexOf('audio/mp4')===0 || (f.type||'').indexOf('audio/m4a')===0; });
    if(audios.length){
      var bestA = audios.sort(function(a,b){return parseInt(b.bitrate||0)-parseInt(a.bitrate||0);})[0];
      audioUrl = absolutizeUrl(bestA.url);
    }
    return { videoUrl: videoUrl, audioUrl: audioUrl };
  }

  // ===== SES PARÇALARI =====
  function buildAudioTracks(videoInfo){
    var adaptive = videoInfo.adaptiveFormats || [];
    var audios = adaptive.filter(function(f){
      return (f.type||'').indexOf('audio/mp4')===0 ||
             (f.type||'').indexOf('audio/m4a')===0 ||
             (f.type||'').indexOf('audio/webm')===0;
    });

    var grouped = {};
    for(var i=0;i<audios.length;i++){
      var a = audios[i];
      var at = a.audioTrack || a.audio_track || {};
      var lang = at.id || a.language || 'und';
      var displayName = at.display_name || a.language || 'Varsayılan';
      var key = lang+'|'+displayName;
      var bitrate = parseInt(a.bitrate||0);
      if(!grouped[key] || bitrate > grouped[key].bitrate){
        grouped[key] = {
          id: key,
          lang: lang,
          label: displayName,
          bitrate: bitrate,
          url: absolutizeUrl(a.url),
          isDefault: !!(at.audio_is_default),
        };
      }
    }

    state.audioTracks = [];
    for(var k in grouped) if(grouped.hasOwnProperty(k)) state.audioTracks.push(grouped[k]);
    state.audioTracks.sort(function(a,b){return b.bitrate - a.bitrate;});

    if(state.audioTracks.length > 0){
      var defaultTrack = null;
      for(var j=0;j<state.audioTracks.length;j++){ if(state.audioTracks[j].isDefault){ defaultTrack = state.audioTracks[j]; break; } }
      state.activeAudioId = (defaultTrack || state.audioTracks[0]).id;
    }

    buildAudioList();
  }

  function buildAudioList(){
    var list = document.getElementById('audioList');
    if(!list) return;

    if(state.audioTracks.length === 0){
      list.innerHTML = '<div class="glass-menu-item" style="opacity:.5;cursor:default;">Tek ses parçası</div>';
      return;
    }

    var html = '';
    for(var i=0;i<state.audioTracks.length;i++){
      var t = state.audioTracks[i];
      var isSelected = state.activeAudioId === t.id;
      var bitrateLabel = t.bitrate ? ' • '+Math.round(t.bitrate/1000)+'kbps' : '';
      var label = escapeHtml(t.label)+bitrateLabel;
      html += '<div class="glass-menu-item '+(isSelected?'selected':'')+'" data-audio="'+escapeHtml(t.id)+'">'+label+'</div>';
    }
    list.innerHTML = html;

    var items = list.querySelectorAll('[data-audio]');
    for(var j=0;j<items.length;j++){
      items[j].onclick = (function(id){ return function(){ selectAudio(id); }; })(items[j].dataset.audio);
    }
  }

  function selectAudio(id){
    if(state.activeAudioId === id){
      document.getElementById('settingsMenu').classList.remove('open');
      return;
    }
    var track = null;
    for(var i=0;i<state.audioTracks.length;i++) if(state.audioTracks[i].id===id){ track = state.audioTracks[i]; break; }
    if(!track) return;

    state.activeAudioId = id;
    var videoEl = document.getElementById('video');

    if(audioSyncEl){ try{audioSyncEl.pause();audioSyncEl.remove();}catch(e){} audioSyncEl = null; }

    if(track.url){
      videoEl.muted = true;
      attachAudioTrack(track.url);
      if(!videoEl.paused && audioSyncEl) audioSyncEl.play().catch(function(){});
    }

    buildAudioList();
    document.getElementById('settingsMenu').classList.remove('open');
    showToast('Ses: '+track.label);
  }

  function attachAudioTrack(audioUrl){
    var videoEl = document.getElementById('video');
    if(audioSyncEl){ try{audioSyncEl.pause();audioSyncEl.remove();}catch(e){} audioSyncEl = null; }
    var a = document.createElement('audio');
    a.src = audioUrl;
    a.preload = 'auto';
    a.style.display = 'none';
    document.body.appendChild(a);
    audioSyncEl = a;

    function sync(){
      if(videoEl.paused){ if(!a.paused) a.pause(); }
      else { if(a.paused) a.play().catch(function(){}); }
      if(Math.abs(videoEl.currentTime - a.currentTime) > 0.3) a.currentTime = videoEl.currentTime;
    }
    videoEl.addEventListener('play', sync);
    videoEl.addEventListener('pause', sync);
    videoEl.addEventListener('seeked', function(){ a.currentTime = videoEl.currentTime; });
    videoEl.addEventListener('timeupdate', function(){
      if(!a.paused && Math.abs(videoEl.currentTime - a.currentTime) > 0.5) a.currentTime = videoEl.currentTime;
    });
    function vol(){ a.volume = videoEl.muted ? 0 : videoEl.volume; a.muted = videoEl.muted; }
    videoEl.addEventListener('volumechange', vol);
    a.volume = videoEl.volume;
    a.muted = videoEl.muted;
    if(!videoEl.paused) a.play().catch(function(){});
  }

  function finishPlayerSetup(videoInfo){
    buildAudioTracks(videoInfo);
    return attachCaptionTracks(videoInfo).then(function(){
      buildSubtitleList();
      buildSpeedList();
      bindPlayerControls(document.getElementById('video'));
    });
  }

  // ===== ALTYAZI =====
  function attachCaptionTracks(videoInfo){
    var videoEl = document.getElementById('video');
    var caps = videoInfo.captions || [];
    if(caps.length === 0){
      state.captionTracks = [];
      return Promise.resolve();
    }

    var chain = Promise.resolve();
    caps.forEach(function(cap){
      chain = chain.then(function(){
        var url = cap.url;
        if(url.indexOf('http')!==0) url = state.currentInstanceUrl + url;
        var u = new URL(url);
        u.searchParams.set('fmt','vtt');
        url = u.toString();

        return fetch(url).then(function(res){
          if(!res.ok){ console.warn('Altyazı HTTP', res.status, cap.language_code); return null; }
          return res.text();
        }).then(function(vtt){
          if(!vtt) return;
          if(vtt.trim().indexOf('WEBVTT')!==0) vtt = convertToVtt(vtt);
          if(!vtt.trim() || vtt.trim() === 'WEBVTT') return;

          var blob = new Blob([vtt], {type:'text/vtt; charset=utf-8'});
          var blobUrl = URL.createObjectURL(blob);
          state.blobUrls.push(blobUrl);

          state.captionTracks.push({
            id: cap.language_code + '_' + Math.random().toString(36).slice(2,8),
            label: cap.label || cap.language_code,
            lang: cap.language_code,
            url: blobUrl,
          });
        }).catch(function(err){
          console.warn('Altyazı yüklenemedi:', cap.language_code, err.message);
        });
      });
    });

    return chain.then(function(){
      for(var i=0;i<state.captionTracks.length;i++){
        var t = state.captionTracks[i];
        var el = document.createElement('track');
        el.kind = 'subtitles';
        el.label = t.label;
        el.srclang = t.lang;
        el.src = t.url;
        el.dataset.captionId = t.id;
        videoEl.appendChild(el);
      }
      var trackEls = videoEl.querySelectorAll('track');
      for(var j=0;j<trackEls.length;j++) trackEls[j].track.mode = 'disabled';
    });
  }

  function convertToVtt(text){
    var t = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    t = t.replace(/^\d+\s*$/gm, '');
    t = t.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    if(t.trim().indexOf('WEBVTT')!==0) t = 'WEBVTT\n\n' + t.trim();
    return t;
  }

  function buildSubtitleList(){
    var list = document.getElementById('subtitleList');
    if(state.captionTracks.length === 0){
      list.innerHTML = '<div class="glass-menu-item" style="opacity:.5;cursor:default;">Altyazı yok</div>';
      return;
    }
    var items = ['<div class="glass-menu-item '+(state.activeCaptionId==='off'?'selected':'')+'" data-cap="off">Kapalı</div>'];
    for(var i=0;i<state.captionTracks.length;i++){
      var t = state.captionTracks[i];
      items.push('<div class="glass-menu-item '+(state.activeCaptionId===t.id?'selected':'')+'" data-cap="'+t.id+'">'+escapeHtml(t.label)+'</div>');
    }
    list.innerHTML = items.join('');
    var els = list.querySelectorAll('[data-cap]');
    for(var j=0;j<els.length;j++){
      els[j].onclick = (function(id){ return function(){ selectCaption(id); }; })(els[j].dataset.cap);
    }
  }

  function selectCaption(id){
    var videoEl = document.getElementById('video');
    state.activeCaptionId = id;
    var trackEls = videoEl.querySelectorAll('track');
    for(var i=0;i<trackEls.length;i++) trackEls[i].track.mode = 'disabled';
    if(id !== 'off'){
      for(var j=0;j<trackEls.length;j++){
        if(trackEls[j].dataset.captionId === id) trackEls[j].track.mode = 'showing';
      }
    }
    buildSubtitleList();
    document.getElementById('subtitleMenu').classList.remove('open');
  }

  // ===== KALİTE =====
  function buildQualityList(variants){
    var list = document.getElementById('qualityList');
    if(!variants || variants.length===0){
      var v = document.getElementById('video').videoHeight;
      list.innerHTML = '<div class="glass-menu-item selected">'+(v?v+'p':'Otomatik')+'</div>';
      return;
    }
    var heights = [];
    for(var i=0;i<variants.length;i++){
      var h = variants[i].height;
      if(h>0 && heights.indexOf(h)===-1) heights.push(h);
    }
    heights.sort(function(a,b){return b-a;});
    var items = ['<div class="glass-menu-item '+(state.currentQuality==='auto'?'selected':'')+'" data-q="auto">Otomatik</div>'];
    for(var j=0;j<heights.length;j++){
      items.push('<div class="glass-menu-item '+(state.currentQuality===String(heights[j])?'selected':'')+'" data-q="'+heights[j]+'">'+heights[j]+'p</div>');
    }
    list.innerHTML = items.join('');
    var els = list.querySelectorAll('[data-q]');
    for(var k=0;k<els.length;k++){
      els[k].onclick = (function(q){ return function(){ selectQuality(q); }; })(els[k].dataset.q);
    }
  }

  function selectQuality(q){
    state.currentQuality = q;
    if(state.shakaPlayer){
      var variants = state.shakaPlayer.getVariantTracks();
      if(q==='auto'){
        state.shakaPlayer.configure({abr:{enabled:true}});
      } else {
        var heightNum = parseInt(q);
        var variant = null;
        for(var i=0;i<variants.length;i++) if(variants[i].height===heightNum){ variant = variants[i]; break; }
        if(variant){
          state.shakaPlayer.configure({abr:{enabled:false}});
          state.shakaPlayer.selectVariantTrack(variant, true);
        }
      }
    }
    buildQualityList(state.shakaPlayer ? state.shakaPlayer.getVariantTracks() : []);
    document.getElementById('settingsMenu').classList.remove('open');
  }

  // ===== HIZ =====
  function buildSpeedList(){
    var list = document.getElementById('speedList');
    var speeds = [0.25,0.5,0.75,1,1.25,1.5,1.75,2];
    var videoEl = document.getElementById('video');
    var current = videoEl.playbackRate;
    var html = '';
    for(var i=0;i<speeds.length;i++){
      var s = speeds[i];
      html += '<div class="glass-menu-item '+(s===current?'selected':'')+'" data-speed="'+s+'">'+s+'x</div>';
    }
    list.innerHTML = html;
    var els = list.querySelectorAll('[data-speed]');
    for(var j=0;j<els.length;j++){
      els[j].onclick = (function(sp){ return function(){ videoEl.playbackRate = parseFloat(sp); buildSpeedList(); }; })(els[j].dataset.speed);
    }
  }

  // ===== CUSTOM CONTROLS =====
  var controlsBound = false;
  function bindPlayerControls(videoEl){
    if(controlsBound) return;
    controlsBound = true;

    var wrap = document.getElementById('playerWrap');
    var playOverlay = document.getElementById('glassPlayOverlay');
    var progressBar = document.getElementById('progressBar');
    var progressFill = document.getElementById('progressFill');
    var progressBuffer = document.getElementById('progressBuffer');
    var progressKnob = document.getElementById('progressKnob');
    var timeCurrent = document.getElementById('timeCurrent');
    var timeDuration = document.getElementById('timeDuration');
    var iconPlay = document.getElementById('iconPlay');
    var btnPlay = document.getElementById('btnPlay');
    var btnSkipBack = document.getElementById('btnSkipBack');
    var btnSkipFwd = document.getElementById('btnSkipFwd');
    var btnMute = document.getElementById('btnMute');
    var iconVolume = document.getElementById('iconVolume');
    var volumeRange = document.getElementById('volumeRange');
    var btnSubtitles = document.getElementById('btnSubtitles');
    var btnSettings = document.getElementById('btnSettings');
    var btnFullscreen = document.getElementById('btnFullscreen');
    var subtitleMenu = document.getElementById('subtitleMenu');
    var settingsMenu = document.getElementById('settingsMenu');

    var hideTimer;
    function showControls(){
      wrap.classList.add('controls-visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){
        if(!videoEl.paused) wrap.classList.remove('controls-visible');
      }, 2500);
    }
    wrap.addEventListener('mousemove', showControls);
    wrap.addEventListener('mouseleave', function(){ if(!videoEl.paused) wrap.classList.remove('controls-visible'); });
    showControls();

    function togglePlay(){
      if(videoEl.paused) videoEl.play().catch(function(){});
      else videoEl.pause();
    }
    btnPlay.onclick = togglePlay;
    playOverlay.onclick = togglePlay;
    videoEl.addEventListener('click', function(){
      if(subtitleMenu.classList.contains('open')||settingsMenu.classList.contains('open')) return;
      togglePlay();
    });

    videoEl.addEventListener('play', function(){
      iconPlay.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      playOverlay.classList.add('hidden');
      showControls();
    });
    videoEl.addEventListener('pause', function(){
      iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>';
      playOverlay.classList.remove('hidden');
      wrap.classList.add('controls-visible');
    });
    videoEl.addEventListener('ended', function(){
      iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>';
      playOverlay.classList.remove('hidden');
    });

    function fmt(t){ if(!t||!isFinite(t))return'0:00'; return formatDuration(t); }
    videoEl.addEventListener('timeupdate', function(){
      var d = videoEl.duration||0;
      var c = videoEl.currentTime||0;
      var pct = d ? (c/d)*100 : 0;
      progressFill.style.width = pct+'%';
      progressKnob.style.left = pct+'%';
      timeCurrent.textContent = fmt(c);
    });
    videoEl.addEventListener('durationchange', function(){
      timeDuration.textContent = fmt(videoEl.duration);
    });
    videoEl.addEventListener('progress', function(){
      if(videoEl.buffered.length && videoEl.duration){
        var bufferedEnd = videoEl.buffered.end(videoEl.buffered.length-1);
        progressBuffer.style.width = (bufferedEnd/videoEl.duration*100)+'%';
      }
    });

    function seekFromEvent(e){
      var rect = progressBar.getBoundingClientRect();
      var x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left);
      var pct = Math.max(0, Math.min(1, x/rect.width));
      if(videoEl.duration) videoEl.currentTime = pct*videoEl.duration;
    }
    var seeking = false;
    progressBar.addEventListener('mousedown', function(e){ seeking=true; seekFromEvent(e); });
    window.addEventListener('mousemove', function(e){ if(seeking) seekFromEvent(e); });
    window.addEventListener('mouseup', function(){ seeking=false; });
    // Dokunmatik destek
    progressBar.addEventListener('touchstart', function(e){ seekFromEvent(e); e.preventDefault(); }, {passive:false});
    progressBar.addEventListener('touchmove', function(e){ seekFromEvent(e); e.preventDefault(); }, {passive:false});

    btnSkipBack.onclick = function(){ videoEl.currentTime = Math.max(0, videoEl.currentTime-10); };
    btnSkipFwd.onclick = function(){ videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime+10); };

    volumeRange.oninput = function(){ videoEl.volume = parseFloat(volumeRange.value); videoEl.muted=false; };
    videoEl.addEventListener('volumechange', function(){
      volumeRange.value = videoEl.muted ? 0 : videoEl.volume;
      if(videoEl.muted||videoEl.volume===0){
        iconVolume.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else if(videoEl.volume<0.5){
        iconVolume.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
      } else {
        iconVolume.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    });
    btnMute.onclick = function(){ videoEl.muted = !videoEl.muted; };

    btnSubtitles.onclick = function(e){
      e.stopPropagation();
      settingsMenu.classList.remove('open');
      subtitleMenu.classList.toggle('open');
    };
    btnSettings.onclick = function(e){
      e.stopPropagation();
      subtitleMenu.classList.remove('open');
      settingsMenu.classList.toggle('open');
    };
    document.addEventListener('click', function(e){
      if(!subtitleMenu.contains(e.target) && e.target!==btnSubtitles) subtitleMenu.classList.remove('open');
      if(!settingsMenu.contains(e.target) && e.target!==btnSettings) settingsMenu.classList.remove('open');
    });

    btnFullscreen.onclick = function(){
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else if(wrap.requestFullscreen) wrap.requestFullscreen();
      else if(wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
      else if(videoEl.webkitEnterFullscreen) videoEl.webkitEnterFullscreen(); // iPhone
    };

    document.addEventListener('keydown', function(e){
      if(['INPUT','TEXTAREA'].indexOf(document.activeElement.tagName)!==-1) return;
      if(!document.getElementById('view-watch').classList.contains('active')) return;
      switch(e.key){
        case ' ': case 'k': e.preventDefault(); togglePlay(); break;
        case 'ArrowLeft': videoEl.currentTime = Math.max(0, videoEl.currentTime-5); break;
        case 'ArrowRight': videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime+5); break;
        case 'f': btnFullscreen.click(); break;
        case 'm': videoEl.muted = !videoEl.muted; break;
        case 'c': btnSubtitles.click(); break;
      }
    });
  }

  // ===== ROUTER =====
  function handleRoute(){
    var hash = location.hash || '#/';
    var watchMatch = hash.match(/^#\/watch\/([\w-]{11})/);
    if(watchMatch) loadWatch(watchMatch[1]);
    else loadHome();
  }

  function init(){
    fetchInvidiousInstances().then(function(){
      window.addEventListener('hashchange', handleRoute);
      handleRoute();
    });
  }

  return { init: init, search: search, goHome: goHome, changeInstance: changeInstance, loadHome: loadHome };
})();

window.addEventListener('DOMContentLoaded', function(){ App.init(); });
</script>
</body>
