
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErdemTube</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    background: #171717;
    display: flex;
    align-items: center;
    padding: 0 5%;
    gap: 30px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #292929;
}

.logo {
    color: #ff3030;
    font-size: 27px;
    font-weight: 900;
    white-space: nowrap;
}

.logo span {
    color: white;
}

.search {
    display: flex;
    flex: 1;
    max-width: 700px;
    margin: auto;
}

.search input {
    flex: 1;
    min-width: 0;
    padding: 14px 20px;
    background: #252525;
    color: white;
    border: 1px solid #444;
    border-radius: 30px 0 0 30px;
    outline: none;
    font-size: 15px;
}

.search button {
    background: #ff3030;
    color: white;
    border: none;
    padding: 0 25px;
    border-radius: 0 30px 30px 0;
    cursor: pointer;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    min-height: calc(100vh - 70px);
}

aside {
    border-right: 1px solid #292929;
    padding: 25px 12px;
}

aside button {
    width: 100%;
    background: transparent;
    border: none;
    color: white;
    text-align: left;
    padding: 14px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
}

aside button:hover {
    background: #292929;
}

main {
    padding: 25px;
    min-width: 0;
}

#status {
    color: #aaa;
    margin-bottom: 20px;
    font-size: 14px;
}

#heading {
    margin-bottom: 20px;
    font-size: 21px;
}

.videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 25px;
}

.video {
    cursor: pointer;
    min-width: 0;
    transition: .2s;
}

.video:hover {
    transform: translateY(-4px);
}

.video img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 12px;
    background: #252525;
}

.video h3 {
    font-size: 15px;
    line-height: 1.5;
    margin-top: 9px;
}

.video p {
    color: #999;
    font-size: 13px;
    margin-top: 6px;
}

#playerSection {
    display: none;
    margin-bottom: 35px;
}

.player {
    width: 100%;
    aspect-ratio: 16/9;
    background: black;
    border-radius: 13px;
    overflow: hidden;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: none;
}

#playerTitle {
    margin-top: 15px;
    font-size: 21px;
}

#playerChannel {
    color: #aaa;
    margin-top: 8px;
}

#more {
    display: none;
    margin: 35px auto;
    background: #ff3030;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 25px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
    border-top: 1px solid #292929;
}

@media(max-width:700px) {
    header {
        padding: 0 12px;
        gap: 12px;
        height: 60px;
    }

    .logo {
        font-size: 21px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    aside {
        display: flex;
        overflow-x: auto;
        padding: 8px;
        border-right: none;
        border-bottom: 1px solid #292929;
    }

    aside button {
        white-space: nowrap;
        width: auto;
        padding: 10px;
    }

    main {
        padding: 15px;
    }

    .videos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
    }

    .video h3 {
        font-size: 13px;
    }
}

@media(max-width:380px) {
    .videos {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Erdem<span>Tube</span></div>

    <div class="search">
        <input
            type="text"
            id="query"
            placeholder="YouTube'da ara..."
            autocomplete="off"
        >
        <button onclick="search()">ARA</button>
    </div>
</header>

<div class="layout">

<aside>
    <button onclick="home()">🏠 Ana Sayfa</button>
    <button onclick="category('müzik')">🎵 Müzik</button>
    <button onclick="category('oyun')">🎮 Oyun</button>
    <button onclick="category('teknoloji')">💻 Teknoloji</button>
    <button onclick="category('komedi')">😂 Komedi</button>
    <button onclick="category('eğitim')">📚 Eğitim</button>
    <button onclick="category('spor')">⚽ Spor</button>
</aside>

<main>

<section id="playerSection">
    <div class="player">
        <iframe
            id="player"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </div>

    <h2 id="playerTitle"></h2>
    <p id="playerChannel"></p>
</section>

<h2 id="heading">ErdemTube'a Hoş Geldin 👋</h2>

<p id="status">Videolar yükleniyor...</p>

<div class="videos" id="videos"></div>

<button id="more" onclick="loadMore()">
    Daha Fazla Video Yükle
</button>

</main>
</div>

<footer>
    © 2026 ErdemTube - İzlemenin Yeni Yolu
</footer>

<script>

// =====================================
// ERDEMTUBE YOUTUBE API KEY
// BURAYA KENDİ API KEY'İNİ YAZ!
// =====================================

const API_KEY = "AIzaSyAqZ0dcg7MPQmeN3YoNbcpo7fMBg-Q8Wzs";

// =====================================

let nextToken = "";
let lastQuery = "";
let busy = false;

const $ = id => document.getElementById(id);

function home() {
    $("query").value = "";
    searchVideos("Türkiye popüler videolar");
}

function category(name) {
    $("query").value = name;
    searchVideos(name);
}

function search() {
    const query = $("query").value.trim();

    if (!query) {
        alert("Aramak istediğin videoyu yaz!");
        return;
    }

    searchVideos(query);
}

$("query").addEventListener("keydown", function(e) {
    if (e.key === "Enter") search();
});

async function searchVideos(query, more = false) {

    if (!API_KEY || API_KEY === "BURAYA_API_KEYINI_YAZ") {
        $("status").textContent =
            "HTML dosyasındaki API_KEY alanına anahtarını yazmalısın.";
        return;
    }

    if (busy) return;

    if (!more) {
        lastQuery = query;
        nextToken = "";
        $("videos").innerHTML = "";
        $("heading").textContent = '"' + query + '" sonuçları';
    }

    busy = true;
    $("status").textContent = "Videolar aranıyor...";
    $("more").style.display = "none";

    try {

        const params = new URLSearchParams({
            part: "snippet",
            q: query,
            type: "video",
            maxResults: "24",
            regionCode: "TR",
            relevanceLanguage: "tr",
            key: API_KEY
        });

        if (more && nextToken) {
            params.set("pageToken", nextToken);
        }

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            params.toString()
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "YouTube API hatası"
            );
        }

        nextToken = data.nextPageToken || "";

        if (!data.items || data.items.length === 0) {
            $("status").textContent = "Video bulunamadı.";
            return;
        }

        data.items.forEach(item => {

            const id = item.id.videoId;
            const snippet = item.snippet;

            if (!id) return;

            const card = document.createElement("div");
            card.className = "video";

            const img = document.createElement("img");

            img.src =
                snippet.thumbnails.high?.url ||
                snippet.thumbnails.medium?.url;

            img.alt = snippet.title;
            img.loading = "lazy";

            const title = document.createElement("h3");
            title.textContent = snippet.title;

            const channel = document.createElement("p");
            channel.textContent = snippet.channelTitle;

            const date = document.createElement("p");
            date.textContent = new Date(
                snippet.publishedAt
            ).toLocaleDateString("tr-TR");

            card.append(img, title, channel, date);

            card.onclick = () => {
                playVideo(
                    id,
                    snippet.title,
                    snippet.channelTitle
                );
            };

            $("videos").appendChild(card);
        });

        $("status").textContent =
            data.items.length + " yeni video bulundu!";

        $("more").style.display =
            nextToken ? "block" : "none";

    } catch (error) {

        $("status").textContent = "Hata: " + error.message;
        console.error(error);

    } finally {
        busy = false;
    }
}

function loadMore() {
    if (nextToken) {
        searchVideos(lastQuery, true);
    }
}

function playVideo(id, title, channel) {

    $("player").src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1";

    $("playerTitle").textContent = title;
    $("playerChannel").textContent = channel;

    $("playerSection").style.display = "block";

    $("playerSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

// İlk açılışta popüler videoları getir.
window.addEventListener("load", () => {
    searchVideos("Türkiye popüler videolar");
});

</script>

</body>
</html>
