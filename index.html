<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErdemTube</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; text-align: center; }
        input { width: 60%; padding: 12px; font-size: 16px; border-radius: 8px; border: none; outline: none; background: #222; color: #fff; }
        button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #ff0000; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; border-radius: 6px; aspect-ratio: 16/9; object-fit: cover; }
        .card h4 { font-size: 14px; margin: 10px 0 5px 0; color: #fff; line-height: 1.4; height: 40px; overflow: hidden; }
        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; flex-direction: column; z-index: 999; }
        iframe { width: 85%; height: 70%; max-width: 900px; border: none; border-radius: 12px; }
        .close-btn { margin-top: 15px; background: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔴 ErdemTube</h1>
    <input type="text" id="searchInput" placeholder="Ne izlemek istiyorsun?" onkeypress="if(event.key==='Enter') videoAra()">
    <button onclick="videoAra()">Ara</button>

    <div class="grid" id="results"></div>
</div>

<div id="playerModal">
    <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
    <button class="close-btn" onclick="kapatPlayer()">Kapat</button>
</div>

<script>
    async function videoAra() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "<p>Videolar getiriliyor...</p>";

        try {
            // YouTube arama önerileri ve video aramasını doğrudan çözen CORS proxy hattı
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/results?search_query=' + query)}`);
            const data = await res.json();
            
            // YouTube sayfasındaki video ID'lerini ve başlıklarını yakala
            const matches = [...data.contents.matchAll(/"videoId":"([^"]+)".*?"title":{"runs":\[{"text":"([^"]+)"}/g)];

            if (matches.length > 0) {
                resultsDiv.innerHTML = "";
                const addedIds = new Set();

                for (let match of matches) {
                    const id = match[1];
                    const title = match[2];

                    if (!addedIds.has(id)) {
                        addedIds.add(id);
                        resultsDiv.innerHTML += `
                            <div class="card" onclick="videoAc('${id}')">
                                <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" loading="lazy">
                                <h4>${title}</h4>
                            </div>
                        `;
                    }
                    if (addedIds.size >= 12) break; // İlk 12 videoyu getir
                }
            } else {
                resultsDiv.innerHTML = "<p>Sonuç bulunamadı, farklı bir arama yap reis!</p>";
            }
        } catch (err) {
            resultsDiv.innerHTML = "<p>Arama yapılırken bir hata oluştu.
