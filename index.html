<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErdemTube</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; text-align: center; }
        .search-box { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        input { width: 60%; padding: 12px; font-size: 16px; border-radius: 8px; border: none; outline: none; background: #222; color: #fff; }
        button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #ff0000; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; border-radius: 6px; aspect-ratio: 16/9; object-fit: cover; }
        .card h4 { font-size: 14px; margin: 10px 0 5px 0; color: #fff; line-height: 1.4; height: 40px; overflow: hidden; }
        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; flex-direction: column; z-index: 999; }
        iframe { width: 85%; height: 70vh; max-width: 900px; border: none; border-radius: 8px; }
        .close-btn { margin-top: 15px; background: #555; padding: 10px 20px; border-radius: 6px; color: #fff; border: none; cursor: pointer; font-size: 15px; }
        .close-btn:hover { background: #777; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔴 ErdemTube</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ne izlemek istiyorsun?" onkeypress="if(event.key==='Enter') videoAra()">
        <button onclick="videoAra()">Ara</button>
    </div>
    <div id="statusText" class="status"></div>

    <div class="grid" id="results"></div>
</div>

<div id="playerModal">
    <iframe id="videoPlayer" allowfullscreen allow="autoplay"></iframe>
    <button class="close-btn" onclick="kapatPlayer()">Videoyu Kapat</button>
</div>

<script>
    async function videoAra() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        const statusText = document.getElementById('statusText');
        
        resultsDiv.innerHTML = "";
        statusText.innerText = "Videolar aranıyor...";

        try {
            // DuckDuckGo Video Arama API'sini Proxy üzerinden çekiyoruz (Asla engellenmez)
            const targetUrl = `https://html.duckduckgo.com/html/?q=site:youtube.com/watch+${encodeURIComponent(query)}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            const res = await fetch(proxyUrl);
            const data = await res.json();
            const htmlText = data.contents;

            // HTML içindeki YouTube video linklerini ve başlıklarını Regex ile ayıkla
            const videoRegex = /href="[^"]*youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})[^"]*"[^>]*>([^<]+)/g;
            let match;
            const eklenenler = new Set();
            let count = 0;

            resultsDiv.innerHTML = "";

            while ((match = videoRegex.exec(htmlText)) !== null) {
                const videoId = match[1];
                let title = match[2].trim();

                // Çöp başlıkları ve tekrarları filtrele
                if (!eklenenler.has(videoId) && title.length > 2 && !title.includes("YouTube")) {
                    eklenenler.add(videoId);
                    count++;

                    resultsDiv.innerHTML += `
                        <div class="card" onclick="videoAc('${videoId}')">
                            <img src="https://i.ytimg.com/vi/${videoId}/hqdefault.jpg" loading="lazy" onerror="this.src='https://via.placeholder.com/300x168?text=Görsel+Yok'">
                            <h4>${title}</h4>
                        </div>
                    `;
                }
            }

            if (count > 0) {
                statusText.innerText = `${count} adet video bulundu!`;
            } else {
                // Yedek Arama Motoru (Yalnızca ID aramalarında veya alt sonuçlarda devreye girer)
                statusText.innerText = "Farklı bir arama terimi deneniyor...";
                yedekArama(query);
            }

        } catch (err) {
            statusText.innerText = "Arama sırasında bir sorun oluştu, tekrar Ara butonuna bas reis!";
        }
    }

    async function yedekArama(query) {
        const resultsDiv = document.getElementById('results');
        const statusText = document.getElementById('statusText');

        try {
            const targetUrl = `https://v3.invidious.076.ne.jp/api/v1/search?q=${encodeURIComponent(query)}`;
            const res = await fetch(targetUrl);
            const data = await res.json();

            if (data && data.length > 0) {
                resultsDiv.innerHTML = "";
                data.forEach(item => {
                    if (item.type === "video") {
                        resultsDiv.innerHTML += `
                            <div class="card" onclick="videoAc('${item.videoId}')">
                                <img src="https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg" loading="lazy">
                                <h4>${item.title}</h4>
                            </div>
                        `;
                    }
                });
                statusText.innerText = "Videolar yüklendi!";
            } else {
                statusText.innerText = "Sonuç bulunamadı, farklı bir kelime ile ara reis.";
            }
        } catch (e) {
            statusText.innerText = "Arama yapılamadı, lütfen tekrar dene.";
        }
    }

    function videoAc(id) {
        const modal = document.getElementById('playerModal');
        const player = document.getElementById('videoPlayer');
        
        // Reklamsız YouTube No-Cookie Oynatıcı
        player.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
        modal.style.display = 'flex';
    }

    function kapatPlayer() {
        const modal = document.getElementById('playerModal');
        const player = document.getElementById('videoPlayer');
        player.src = "";
        modal.style.display = 'none';
    }
</script>

</body>
</html>
