<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KendiTube</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --text: #f1f1f1;
      --muted: #aaa;
      --accent: #ff0000;
      --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; gap: 12px; align-items: center;
    }
    .logo { font-weight: 700; font-size: 1.25rem; color: var(--accent); white-space: nowrap; }
    .search-box {
      flex: 1; display: flex; gap: 8px;
    }
    input[type="search"] {
      flex: 1; padding: 10px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 1rem;
    }
    button {
      padding: 10px 18px; border-radius: 999px; border: none;
      background: var(--accent); color: white; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card); border-radius: 12px; overflow: hidden;
      cursor: pointer; transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .card-body { padding: 12px; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 0.8rem; color: var(--muted); }
    #player-section { display: none; }
    #player-section.active { display: block; }
    .player-wrapper {
      background: #000; border-radius: 12px; overflow: hidden;
      margin-bottom: 16px; position: relative;
    }
    video { width: 100%; max-height: 70vh; display: block; background: #000; }
    .video-info h1 { font-size: 1.35rem; margin-bottom: 8px; }
    .video-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .desc { white-space: pre-wrap; font-size: 0.95rem; color: #ccc;
      max-height: 150px; overflow-y: auto; }
    .back-btn { margin-bottom: 16px; background: var(--card); }
    .status { text-align: center; padding: 40px; color: var(--muted); }
    .instance-select { font-size: 0.8rem; color: var(--muted); }
    select { background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">KendiTube</div>
    <div class="search-box">
      <input type="search" id="q" placeholder="Ara..." autocomplete="off" />
      <button id="searchBtn">Ara</button>
    </div>
    <div class="instance-select">
      <select id="instance">
        <option value="https://pipedapi.kavin.rocks">kavin.rocks (resmi)</option>
        <option value="https://pipedapi.leptons.xyz">leptons.xyz</option>
        <option value="https://pipedapi.adminforge.de">adminforge.de</option>
        <option value="https://api.piped.yt">piped.yt</option>
        <option value="https://pipedapi.drgns.space">drgns.space</option>
      </select>
    </div>
  </header>

  <main>
    <div id="home">
      <div id="status" class="status">Aramak için yukarıya yaz...</div>
      <div id="results" class="grid"></div>
    </div>

    <div id="player-section">
      <button class="back-btn" id="backBtn">← Geri</button>
      <div class="player-wrapper">
        <video id="player" controls playsinline></video>
      </div>
      <div class="video-info">
        <h1 id="v-title"></h1>
        <div class="video-meta" id="v-meta"></div>
        <div class="desc" id="v-desc"></div>
      </div>
    </div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const resultsEl = $('#results');
    const statusEl = $('#status');
    const player = $('#player');
    const home = $('#home');
    const playerSection = $('#player-section');

    let currentInstance = $('#instance').value;

    $('#instance').addEventListener('change', e => {
      currentInstance = e.target.value;
    });

    async function api(path) {
      const url = currentInstance.replace(/\/$/, '') + path;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`API hatası: ${res.status}`);
      return res.json();
    }

    function formatDuration(sec) {
      if (!sec) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0
        ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${m}:${String(s).padStart(2,'0')}`;
    }

    function formatViews(n) {
      if (!n) return '';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M görüntüleme';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'B görüntüleme';
      return n + ' görüntüleme';
    }

    async function search(q) {
      if (!q.trim()) return;
      statusEl.textContent = 'Aranıyor...';
      resultsEl.innerHTML = '';
      home.style.display = 'block';
      playerSection.classList.remove('active');

      try {
        // filter=videos sadece video sonuçları getirir
        const data = await api(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        const items = data.items || [];

        if (items.length === 0) {
          statusEl.textContent = 'Sonuç bulunamadı.';
          return;
        }

        statusEl.textContent = '';
        items.forEach(item => {
          if (item.type !== 'stream' && !item.url) return; // sadece video

          const id = (item.url || '').split('v=')[1] || item.url?.split('/').pop();
          if (!id) return;

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${item.thumbnail || ''}" alt="" loading="lazy" />
            <div class="card-body">
              <div class="card-title">${item.title || ''}</div>
              <div class="card-meta">
                ${item.uploader || ''} · ${formatViews(item.views)} · ${item.uploadedDate || ''}
                ${item.duration ? ' · ' + formatDuration(item.duration) : ''}
              </div>
            </div>
          `;
          card.onclick = () => playVideo(id);
          resultsEl.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = 'Hata: ' + err.message + ' — Instance değiştirip tekrar dene.';
        console.error(err);
      }
    }

    async function playVideo(videoId) {
      statusEl.textContent = 'Video yükleniyor...';
      home.style.display = 'none';
      playerSection.classList.add('active');
      player.removeAttribute('src');
      player.load();

      try {
        const data = await api(`/streams/${videoId}`);

        $('#v-title').textContent = data.title || '';
        $('#v-meta').textContent = `${data.uploader || ''} · ${formatViews(data.views)} · ${data.uploadDate || ''}`;
        $('#v-desc').textContent = data.description || '';

        // En iyi progressive stream'i seç (videoOnly=false tercih)
        let stream = null;
        const streams = data.videoStreams || [];

        // Önce ses+görüntü birleşik olanları dene (düşük kalite olsa bile)
        const combined = streams
          .filter(s => !s.videoOnly && s.mimeType?.includes('mp4'))
          .sort((a, b) => (b.height || 0) - (a.height || 0));

        if (combined.length) {
          stream = combined[0];
        } else {
          // Yoksa en yüksek çözünürlüklü videoOnly (ses ayrı olacak ama basit tutuyoruz)
          const videoOnly = streams
            .filter(s => s.mimeType?.includes('mp4'))
            .sort((a, b) => (b.height || 0) - (a.height || 0));
          if (videoOnly.length) stream = videoOnly[0];
        }

        // HLS varsa (livestream veya bazı videolar) onu tercih et
        if (data.hls) {
          // Basit çözüm: HLS destekleyen tarayıcılar için
          // Daha iyi deneyim için HLS.js eklenebilir ama tek dosya için native deniyoruz
          player.src = data.hls;
        } else if (stream?.url) {
          player.src = stream.url;
        } else {
          throw new Error('Uygun stream bulunamadı');
        }

        player.play().catch(() => {});
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Video açılamadı: ' + err.message;
        console.error(err);
      }
    }

    $('#searchBtn').onclick = () => search($('#q').value);
    $('#q').addEventListener('keydown', e => {
      if (e.key === 'Enter') search($('#q').value);
    });
    $('#backBtn').onclick = () => {
      player.pause();
      player.removeAttribute('src');
      playerSection.classList.remove('active');
      home.style.display = 'block';
    };

    // İlk açılışta trending (isteğe bağlı)
    // search(' '); // boş bırakıyorum, kullanıcı arasın
  </script>
</body>
</html>
