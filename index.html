
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>ErdemTube</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101010;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    background: #181818;
    display: flex;
    align-items: center;
    padding: 0 4%;
    gap: 30px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #292929;
}

.logo {
    color: #ff3030;
    font-size: 27px;
    font-weight: 900;
    white-space: nowrap;
    letter-spacing: -1px;
}

.logo span {
    color: white;
}

.search {
    display: flex;
    flex: 1;
    max-width: 700px;
    margin: auto;
}

.search input {
    flex: 1;
    min-width: 0;
    background: #252525;
    border: 1px solid #444;
    color: white;
    padding: 14px 20px;
    border-radius: 30px 0 0 30px;
    outline: none;
    font-size: 15px;
}

.search button {
    background: #ff3030;
    border: none;
    color: white;
    padding: 0 25px;
    border-radius: 0 30px 30px 0;
    cursor: pointer;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    min-height: calc(100vh - 70px);
}

aside {
    padding: 25px 12px;
    border-right: 1px solid #292929;
}

aside button {
    display: block;
    width: 100%;
    background: transparent;
    color: white;
    border: none;
    padding: 14px;
    text-align: left;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
}

aside button:hover,
aside button.active {
    background: #292929;
}

main {
    min-width: 0;
    padding: 25px;
}

#heading {
    font-size: 21px;
    margin-bottom: 15px;
}

#status {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
}

.videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 25px;
}

.video {
    cursor: pointer;
    min-width: 0;
    transition: .2s;
}

.video:hover {
    transform: translateY(-4px);
}

.video img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 12px;
    background: #252525;
}

.video h3 {
    font-size: 15px;
    line-height: 1.5;
    margin-top: 9px;
}

.video p {
    color: #999;
    font-size: 13px;
    margin-top: 6px;
}

/* INVIDIOUS PLAYER */

#playerSection {
    display: none;
    margin-bottom: 35px;
    background: #181818;
    padding: 15px;
    border-radius: 14px;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
    gap: 10px;
}

.player-label {
    color: #ff4545;
    font-size: 13px;
    font-weight: bold;
}

.close-player {
    background: #292929;
    border: none;
    color: white;
    padding: 8px 13px;
    border-radius: 7px;
    cursor: pointer;
}

.player {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

#playerTitle {
    font-size: 21px;
    margin-top: 16px;
    line-height: 1.4;
}

#playerChannel {
    color: #aaa;
    margin-top: 9px;
    font-size: 14px;
}

.player-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.player-info a {
    color: #ff5555;
    font-size: 13px;
    text-decoration: none;
}

#more {
    display: none;
    margin: 35px auto;
    padding: 13px 25px;
    background: #ff3030;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

#more:disabled {
    opacity: .5;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
    border-top: 1px solid #292929;
    font-size: 13px;
}

@media(max-width:700px) {
    header {
        height: 60px;
        padding: 0 12px;
        gap: 12px;
    }

    .logo {
        font-size: 21px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    aside {
        display: flex;
        overflow-x: auto;
        padding: 8px;
        border-right: none;
        border-bottom: 1px solid #292929;
    }

    aside button {
        width: auto;
        white-space: nowrap;
        padding: 10px;
    }

    main {
        padding: 15px;
    }

    .videos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
    }

    .video h3 {
        font-size: 13px;
    }

    #playerSection {
        padding: 9px;
    }

    #playerTitle {
        font-size: 17px;
    }
}

@media(max-width:380px) {
    .videos {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Erdem<span>Tube</span></div>

    <div class="search">
        <input
            id="query"
            type="search"
            placeholder="Ne izlemek istiyorsun?"
            autocomplete="off"
        >
        <button onclick="search()">ARA</button>
    </div>
</header>

<div class="layout">

<aside>
    <button class="active" onclick="home(this)">🏠 Ana Sayfa</button>
    <button onclick="category('müzik',this)">🎵 Müzik</button>
    <button onclick="category('oyun',this)">🎮 Oyun</button>
    <button onclick="category('teknoloji',this)">💻 Teknoloji</button>
    <button onclick="category('komedi',this)">😂 Komedi</button>
    <button onclick="category('eğitim',this)">📚 Eğitim</button>
    <button onclick="category('spor',this)">⚽ Spor</button>
    <button onclick="category('belgesel',this)">🌍 Belgesel</button>
</aside>

<main>

    <!-- INVIDIOUS VIDEO PLAYER -->

    <section id="playerSection">

        <div class="player-header">
            <span class="player-label">
                ● ERDEMTUBE INVIDIOUS PLAYER
            </span>

            <button class="close-player" onclick="closePlayer()">
                ✕ Kapat
            </button>
        </div>

        <div class="player">
            <iframe
                id="player"
                title="ErdemTube Invidious Video Player"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen
                referrerpolicy="no-referrer">
            </iframe>
        </div>

        <h2 id="playerTitle"></h2>

        <div class="player-info">
            <p id="playerChannel"></p>

            <a id="instanceLink"
               href="https://invidious.tiekoetter.com"
               target="_blank"
               rel="noopener noreferrer">
               Invidious sunucusu ↗
            </a>
        </div>

    </section>

    <h2 id="heading">ErdemTube'a Hoş Geldin 👋</h2>

    <p id="status">Videolar yükleniyor...</p>

    <div class="videos" id="videos"></div>

    <button id="more" onclick="loadMore()">
        Daha Fazla Video Yükle
    </button>

</main>
</div>

<footer>
    © 2026 ErdemTube | Independent Video Experience
</footer>

<script>

// ======================================
// ERDEMTUBE API AYARLARI
// ======================================

// YouTube API Key'ini buraya yaz.

const API_KEY = "AIzaSyAqZ0dcg7MPQmeN3YoNbcpo7fMBg-Q8Wzs";

// Invidious sunucusu.
// Resmî listede bulunan bir alternatifle değiştirebilirsin.

const INVIDIOUS_INSTANCE = "https://invidious.tiekoetter.com";

// Diğer resmî listelenmiş alternatifler:
//
// https://inv.nadeko.net
// https://invidious.nerdvpn.de
// https://yt.chocolatemoo53.com
// https://invidious.f5.si
// https://inv.miningtcup.me

// ======================================

let nextToken = "";
let lastQuery = "";
let busy = false;

const $ = id => document.getElementById(id);


// ANA SAYFA

function home(button) {
    setActive(button);
    $("query").value = "";
    closePlayer();
    searchVideos("Türkiye popüler videolar");
}


// KATEGORİLER

function category(name, button) {
    setActive(button);
    $("query").value = name;
    closePlayer();
    searchVideos(name);
}


// AKTİF MENÜ

function setActive(button) {
    document.querySelectorAll("aside button").forEach(btn => {
        btn.classList.remove("active");
    });

    if(button) button.classList.add("active");
}


// ARAMA

function search() {
    const q = $("query").value.trim();

    if (!q) {
        alert("Aramak istediğin videoyu yaz!");
        return;
    }

    closePlayer();
    searchVideos(q);
}

$("query").addEventListener("keydown", e => {
    if (e.key === "Enter") search();
});


// YOUTUBE API ARAMA

async function searchVideos(query, more = false) {

    if (!API_KEY || API_KEY === "BURAYA_API_KEYINI_YAZ") {
        $("status").textContent =
            "HTML dosyasındaki API_KEY alanına kendi anahtarını yazmalısın.";
        return;
    }

    if (busy) return;

    if (!more) {
        lastQuery = query;
        nextToken = "";
        $("videos").innerHTML = "";
        $("heading").textContent = '"' + query + '" sonuçları';
    }

    busy = true;

    $("status").textContent = "Videolar aranıyor...";
    $("more").style.display = "none";

    try {

        const params = new URLSearchParams({
            part: "snippet",
            q: query,
            type: "video",
            maxResults: "24",
            regionCode: "TR",
            relevanceLanguage: "tr",
            key: API_KEY
        });

        if (more && nextToken) {
            params.set("pageToken", nextToken);
        }

        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            params.toString()
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "YouTube API hatası"
            );
        }

        nextToken = data.nextPageToken || "";

        if (!data.items || data.items.length === 0) {
            $("status").textContent = "Video bulunamadı.";
            return;
        }

        data.items.forEach(item => {

            const videoId = item.id.videoId;
            const snippet = item.snippet;

            if (!videoId) return;

            const card = document.createElement("article");
            card.className = "video";

            const img = document.createElement("img");

            img.src =
                snippet.thumbnails.high?.url ||
                snippet.thumbnails.medium?.url ||
                snippet.thumbnails.default?.url;

            img.alt = snippet.title;
            img.loading = "lazy";

            const title = document.createElement("h3");
            title.textContent = snippet.title;

            const channel = document.createElement("p");
            channel.textContent = snippet.channelTitle;

            const date = document.createElement("p");
            date.textContent = new Date(
                snippet.publishedAt
            ).toLocaleDateString("tr-TR");

            card.append(img, title, channel, date);

            card.addEventListener("click", () => {
                playVideo(
                    videoId,
                    snippet.title,
                    snippet.channelTitle
                );
            });

            $("videos").appendChild(card);

        });

        $("status").textContent =
            data.items.length + " yeni video bulundu!";

        $("more").style.display =
            nextToken ? "block" : "none";

    } catch(error) {

        console.error(error);

        $("status").textContent =
            "Arama hatası: " + error.message;

    } finally {
        busy = false;
    }
}


// INVIDIOUS OYNATICI

function playVideo(id, title, channel) {

    const base = INVIDIOUS_INSTANCE.replace(/\/+$/, "");

    const playerURL =
        base +
        "/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1&controls=1&dark_mode=true&player_style=invidious";

    $("player").src = playerURL;

    $("playerTitle").textContent = title;
    $("playerChannel").textContent = channel;

    $("instanceLink").href = base + "/watch?v=" +
        encodeURIComponent(id);

    $("playerSection").style.display = "block";

    $("playerSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


// OYNATICIYI KAPAT

function closePlayer() {

    $("player").src = "";

    $("playerSection").style.display = "none";
}


// DAHA FAZLA VİDEO

function loadMore() {

    if (nextToken) {
        searchVideos(lastQuery, true);
    }
}


// İLK AÇILIŞ

window.addEventListener("load", () => {

    searchVideos("@yapayzeka_gundemi");

});


// SAYFADAN ÇIKARKEN VİDEOYU DURDUR

window.addEventListener("pagehide", () => {
    $("player").src = "";
});

</script>

</body>
</html>
