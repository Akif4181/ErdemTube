<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErdemTube</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --text: #f1f1f1;
      --muted: #aaa;
      --accent: #ff0000;
      --border: #2a2a2a;
      --header: rgba(15,15,15,0.94);
    }
    [data-theme="light"] {
      --bg: #f4f4f4;
      --card: #fff;
      --text: #111;
      --muted: #666;
      --accent: #cc0000;
      --border: #e0e0e0;
      --header: rgba(255,255,255,0.94);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--header);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 11px 18px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .logo {
      font-weight: 800; font-size: 1.35rem; color: var(--accent);
      cursor: pointer; letter-spacing: -0.5px;
    }
    .search-box { flex: 1; min-width: 220px; display: flex; gap: 8px; }
    input[type="search"] {
      flex: 1; padding: 11px 18px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 1rem;
    }
    button, .btn {
      padding: 10px 18px; border-radius: 999px; border: none;
      background: var(--accent); color: #fff; font-weight: 600;
      cursor: pointer; font-size: 0.95rem;
    }
    .icon-btn {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); width: 42px; height: 42px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; cursor: pointer;
    }
    select {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); padding: 9px 12px;
      border-radius: 10px; font-size: 0.85rem;
    }
    main { max-width: 1320px; margin: 0 auto; padding: 22px 18px 70px; }

    .section-title {
      font-size: 1.2rem; font-weight: 700; margin: 28px 0 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card); border-radius: 14px; overflow: hidden;
      cursor: pointer; transition: transform 0.18s, box-shadow 0.18s;
      border: 1px solid transparent;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #222; }
    .card-body { padding: 12px 14px 15px; }
    .card-title {
      font-size: 0.95rem; font-weight: 600; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { font-size: 0.8rem; color: var(--muted); }

    #player-view { display: none; }
    #player-view.active { display: block; }
    .player-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
    }
    @media (max-width: 1000px) {
      .player-layout { grid-template-columns: 1fr; }
    }
    .player-wrapper {
      background: #000; border-radius: 14px; overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .plyr { --plyr-color-main: #ff0000; border-radius: 14px; }
    .video-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
    .video-meta { color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
    .desc {
      white-space: pre-wrap; font-size: 0.94rem; color: var(--muted);
      max-height: 180px; overflow-y: auto; background: var(--card);
      padding: 14px; border-radius: 12px; margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .quality-bar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
      align-items: center;
    }
    .quality-bar span { font-size: 0.85rem; color: var(--muted); }
    .q-btn {
      padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.82rem; cursor: pointer;
      transition: 0.15s;
    }
    .q-btn:hover { border-color: var(--accent); }
    .q-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .related { max-height: 85vh; overflow-y: auto; padding-right: 6px; }
    .related .card { margin-bottom: 14px; }

    .status { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.05rem; }
    .back-btn {
      margin-bottom: 18px; background: var(--card); color: var(--text);
      border: 1px solid var(--border);
    }
    .history-clear {
      font-size: 0.8rem; background: transparent; color: var(--muted);
      border: 1px solid var(--border); padding: 5px 12px;
    }
    .api-warning {
      background: #3a1a1a; color: #ffb4b4; padding: 12px 16px;
      border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem;
      border: 1px solid #5a2a2a; display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" id="logo">ErdemTube</div>
    <div class="search-box">
      <input type="search" id="q" placeholder="YouTube'da ara..." autocomplete="off" />
      <button id="searchBtn">Ara</button>
    </div>
    <select id="instance" title="Stream kaynağı (Piped)">
      <option value="https://pipedapi.kavin.rocks">kavin.rocks</option>
      <option value="https://pipedapi.leptons.xyz">leptons.xyz</option>
      <option value="https://pipedapi.adminforge.de">adminforge</option>
      <option value="https://api.piped.yt">piped.yt</option>
      <option value="https://pipedapi.drgns.space">drgns.space</option>
    </select>
    <button class="icon-btn" id="themeBtn" title="Tema">🌓</button>
  </header>

  <main>
    <div class="api-warning" id="apiWarning">
      YouTube API anahtarı girilmemiş! Kodun içindeki <b>YT_API_KEY</b> kısmına kendi anahtarını yaz.
    </div>

    <div id="home">
      <div id="status" class="status">Yükleniyor...</div>

      <div id="history-section" style="display:none;">
        <div class="section-title">
          Son İzlenenler
          <button class="history-clear" id="clearHistory">Temizle</button>
        </div>
        <div id="history" class="grid"></div>
      </div>

      <div class="section-title">Türkiye Trendleri</div>
      <div id="trending" class="grid"></div>

      <div id="search-results-section" style="display:none;">
        <div class="section-title">Arama Sonuçları</div>
        <div id="results" class="grid"></div>
      </div>
    </div>

    <div id="player-view">
      <button class="back-btn" id="backBtn">← Geri</button>
      <div class="player-layout">
        <div class="player-main">
          <div class="player-wrapper">
            <video id="player" playsinline controls crossorigin></video>
          </div>
          <div class="quality-bar" id="qualityBar" style="display:none;">
            <span>Kalite:</span>
          </div>
          <h1 class="video-title" id="v-title"></h1>
          <div class="video-meta" id="v-meta"></div>
          <div class="desc" id="v-desc"></div>
        </div>
        <div class="related">
          <div class="section-title">Önerilenler</div>
          <div id="related" class="grid" style="grid-template-columns:1fr;"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>

  <script>
    // ============================================================
    //  BURAYA KENDİ YOUTUBE DATA API v3 ANAHTARINI YAZ
    // ============================================================
    const YT_API_KEY = 'AIzaSyAqZ0dcg7MPQmeN3YoNbcpo7fMBg-Q8Wzs';   // <-- burayı değiştir
    // ============================================================

    const HISTORY_KEY = 'erdemtube_history';
    const THEME_KEY = 'erdemtube_theme';
    const MAX_HISTORY = 30;

    const $ = s => document.querySelector(s);
    const home = $('#home');
    const playerView = $('#player-view');
    const statusEl = $('#status');
    const resultsEl = $('#results');
    const trendingEl = $('#trending');
    const historyEl = $('#history');
    const relatedEl = $('#related');
    const qualityBar = $('#qualityBar');
    const videoEl = $('#player');
    const apiWarning = $('#apiWarning');

    let currentInstance = $('#instance').value;
    let plyrInstance = null;
    let hlsInstance = null;

    // Tema
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(THEME_KEY, t);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
    $('#themeBtn').onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    };

    $('#instance').onchange = e => currentInstance = e.target.value;

    // ========== YOUTUBE DATA API ==========
    async function ytApi(endpoint, params = {}) {
      if (!YT_API_KEY || YT_API_KEY === 'BURAYA_API_KEY_YAZ') {
        apiWarning.style.display = 'block';
        throw new Error('YouTube API anahtarı girilmemiş');
      }
      const url = new URL(`https://www.googleapis.com/youtube/v3/${endpoint}`);
      url.searchParams.set('key', YT_API_KEY);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'YT API hatası');
      return data;
    }

    // ========== PIPED (sadece stream için) ==========
    async function getStreams(videoId) {
      const base = currentInstance.replace(/\/$/, '');
      const res = await fetch(`${base}/streams/${videoId}`);
      if (!res.ok) throw new Error(`Stream alınamadı (${res.status})`);
      return res.json();
    }

    // Yardımcılar
    function formatDuration(sec) {
      if (!sec && sec !== 0) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }
    function formatViews(n) {
      if (!n) return '';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.0','') + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace('.0','') + 'B';
      return n + '';
    }
    function parseISODuration(iso) {
      if (!iso) return 0;
      const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!m) return 0;
      return (parseInt(m[1]||0)*3600) + (parseInt(m[2]||0)*60) + parseInt(m[3]||0);
    }

    // Kart oluşturucu
    function createCardFromYT(item) {
      const id = item.id?.videoId || item.id;
      if (!id) return null;
      const sn = item.snippet || {};
      const thumbs = sn.thumbnails || {};
      const thumb = thumbs.maxres?.url || thumbs.high?.url || thumbs.medium?.url || thumbs.default?.url || '';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${thumb}" alt="" loading="lazy" />
        <div class="card-body">
          <div class="card-title">${sn.title || ''}</div>
          <div class="card-meta">
            ${sn.channelTitle || ''}
            ${item.statistics?.viewCount ? ' · ' + formatViews(item.statistics.viewCount) : ''}
          </div>
        </div>
      `;
      card.onclick = () => playVideo(id, {
        title: sn.title,
        channelTitle: sn.channelTitle,
        thumb
      });
      return card;
    }

    // Geçmiş
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
    }
    function saveToHistory(video) {
      let hist = getHistory().filter(v => v.videoId !== video.videoId);
      hist.unshift(video);
      if (hist.length > MAX_HISTORY) hist = hist.slice(0, MAX_HISTORY);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
      renderHistory();
    }
    function renderHistory() {
      const hist = getHistory();
      historyEl.innerHTML = '';
      if (!hist.length) {
        $('#history-section').style.display = 'none';
        return;
      }
      $('#history-section').style.display = 'block';
      hist.forEach(item => {
        const fakeItem = {
          id: item.videoId,
          snippet: {
            title: item.title,
            channelTitle: item.channelTitle,
            thumbnails: { medium: { url: item.thumb } }
          }
        };
        const c = createCardFromYT(fakeItem);
        if (c) historyEl.appendChild(c);
      });
    }
    $('#clearHistory').onclick = () => {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    };

    // Trend
    async function loadTrending() {
      statusEl.textContent = 'Trend videolar yükleniyor...';
      try {
        const data = await ytApi('videos', {
          part: 'snippet,statistics,contentDetails',
          chart: 'mostPopular',
          regionCode: 'TR',
          maxResults: 24
        });
        trendingEl.innerHTML = '';
        (data.items || []).forEach(item => {
          const c = createCardFromYT(item);
          if (c) trendingEl.appendChild(c);
        });
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Trend yüklenemedi: ' + err.message;
      }
    }

    // Arama
    async function search(q) {
      if (!q.trim()) return;
      statusEl.textContent = 'Aranıyor...';
      resultsEl.innerHTML = '';
      $('#search-results-section').style.display = 'block';
      home.style.display = 'block';
      playerView.classList.remove('active');

      try {
        const data = await ytApi('search', {
          part: 'snippet',
          q: q,
          type: 'video',
          maxResults: 24,
          order: 'relevance'
        });
        if (!data.items?.length) {
          statusEl.textContent = 'Sonuç bulunamadı.';
          return;
        }
        statusEl.textContent = '';
        data.items.forEach(item => {
          const c = createCardFromYT(item);
          if (c) resultsEl.appendChild(c);
        });
      } catch (err) {
        statusEl.textContent = 'Arama hatası: ' + err.message;
      }
    }

    // Player temizle
    function destroyPlayer() {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      if (plyrInstance) { plyrInstance.destroy(); plyrInstance = null; }
      videoEl.removeAttribute('src');
      videoEl.load();
      qualityBar.style.display = 'none';
      qualityBar.innerHTML = '<span>Kalite:</span>';
    }

    // Oynatma
    async function playVideo(videoId, meta = {}) {
      destroyPlayer();
      home.style.display = 'none';
      playerView.classList.add('active');

      $('#v-title').textContent = meta.title || 'Yükleniyor...';
      $('#v-meta').textContent = meta.channelTitle || '';
      $('#v-desc').textContent = '';
      relatedEl.innerHTML = '';

      try {
        // Video detayları (YouTube API)
        const details = await ytApi('videos', {
          part: 'snippet,statistics,contentDetails',
          id: videoId
        });
        const video = details.items?.[0];
        if (video) {
          const sn = video.snippet;
          $('#v-title').textContent = sn.title;
          $('#v-meta').textContent = `${sn.channelTitle} · ${formatViews(video.statistics?.viewCount)} görüntüleme · ${formatDuration(parseISODuration(video.contentDetails?.duration))}`;
          $('#v-desc').textContent = sn.description || '';

          saveToHistory({
            videoId,
            title: sn.title,
            channelTitle: sn.channelTitle,
            thumb: sn.thumbnails?.medium?.url || sn.thumbnails?.default?.url
          });
        }

        // Önerilenler (YouTube API)
        try {
          const related = await ytApi('search', {
            part: 'snippet',
            relatedToVideoId: videoId,
            type: 'video',
            maxResults: 16
          });
          relatedEl.innerHTML = '';
          (related.items || []).forEach(item => {
            const c = createCardFromYT(item);
            if (c) relatedEl.appendChild(c);
          });
        } catch (e) {
          console.warn('Related alınamadı', e);
        }

        // Stream (Piped) → kendi player
        const streamData = await getStreams(videoId);

        if (streamData.hls && Hls.isSupported()) {
          hlsInstance = new Hls({ enableWorker: true, maxBufferLength: 30 });
          hlsInstance.loadSource(streamData.hls);
          hlsInstance.attachMedia(videoEl);

          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            const levels = hlsInstance.levels;
            const qualities = levels.map(l => l.height).filter(Boolean);
            qualities.unshift(0);

            plyrInstance = new Plyr(videoEl, {
              quality: {
                default: 0,
                options: qualities,
                forced: true,
                onChange: q => {
                  if (q === 0) hlsInstance.currentLevel = -1;
                  else {
                    const idx = levels.findIndex(l => l.height === q);
                    if (idx >= 0) hlsInstance.currentLevel = idx;
                  }
                }
              },
              i18n: { qualityLabel: { 0: 'Otomatik' } },
              keyboard: { focused: true, global: true }
            });
            videoEl.play().catch(() => {});
          });
        } else {
          let candidates = (streamData.videoStreams || [])
            .filter(s => s.mimeType?.includes('mp4'))
            .sort((a, b) => (b.height || 0) - (a.height || 0));

          const combined = candidates.filter(s => !s.videoOnly);
          if (combined.length) candidates = combined;

          if (!candidates.length) throw new Error('Uygun video stream bulunamadı');

          const sources = candidates.map(s => ({
            src: s.url,
            type: s.mimeType || 'video/mp4',
            size: s.height || 720
          }));

          plyrInstance = new Plyr(videoEl, {
            quality: {
              default: sources[0].size,
              options: sources.map(s => s.size),
              forced: true
            },
            keyboard: { focused: true, global: true }
          });

          plyrInstance.source = {
            type: 'video',
            title: meta.title || '',
            sources
          };

          qualityBar.style.display = 'flex';
          candidates.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'q-btn' + (i === 0 ? ' active' : '');
            btn.textContent = s.quality || (s.height + 'p');
            btn.onclick = () => {
              document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              const t = videoEl.currentTime;
              videoEl.src = s.url;
              videoEl.currentTime = t;
              videoEl.play().catch(() => {});
            };
            qualityBar.appendChild(btn);
          });

          videoEl.play().catch(() => {});
        }
      } catch (err) {
        $('#v-title').textContent = 'Hata oluştu';
        $('#v-desc').textContent = err.message + '\n\nFarklı bir Piped instance seçip tekrar dene.';
        console.error(err);
      }
    }

    // Eventler
    $('#searchBtn').onclick = () => search($('#q').value);
    $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') search($('#q').value); });
    $('#backBtn').onclick = () => {
      destroyPlayer();
      playerView.classList.remove('active');
      home.style.display = 'block';
    };
    $('#logo').onclick = () => {
      destroyPlayer();
      playerView.classList.remove('active');
      home.style.display = 'block';
      $('#search-results-section').style.display = 'none';
      $('#q').value = '';
    };

    // Başlat
    if (!YT_API_KEY || YT_API_KEY === 'BURAYA_API_KEY_YAZ') {
      apiWarning.style.display = 'block';
      statusEl.textContent = 'Önce YouTube API anahtarını koda ekle.';
    } else {
      renderHistory();
      loadTrending();
    }
  </script>
</body>
</html>
