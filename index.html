<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>ErdemTube</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #181818; position: -webkit-sticky; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid #303030; flex-wrap: wrap; }
  .logo { font-size: 18px; font-weight: 700; color: #f1f1f1; text-decoration: none; flex-shrink: 0; }
  .logo span { color: #f00; }
  .searchbar { flex: 1; display: flex; min-width: 120px; }
  .searchbar input { flex: 1; padding: 7px 12px; border: 1px solid #303030; background: #0f0f0f; color: #f1f1f1; border-radius: 18px 0 0 18px; font-size: 16px; outline: none; min-width: 0; -webkit-appearance: none; }
  .searchbar button { padding: 7px 12px; border: 1px solid #303030; border-left: none; background: #212121; color: #f1f1f1; border-radius: 0 18px 18px 0; cursor: pointer; font-size: 16px; -webkit-appearance: none; }
  .header-right select { padding: 5px 8px; background: #212121; color: #f1f1f1; border: 1px solid #303030; border-radius: 6px; max-width: 130px; font-size: 12px; }
  main { padding: 12px; max-width: 1600px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }
  .grid { display: block; }
  .card { cursor: pointer; border-radius: 8px; overflow: hidden; background: #181818; margin-bottom: 12px; }
  .card-thumb { position: relative; background: #000; overflow: hidden; height: 0; padding-top: 56.25%; }
  .card-thumb img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,.85); padding: 2px 6px; border-radius: 3px; font-size: 11px; color: #fff; }
  .card-info { padding: 8px; }
  .card-title { font-weight: 500; font-size: 13px; line-height: 1.3; margin-bottom: 4px; }
  .card-channel { font-size: 12px; color: #aaa; }
  .card-meta { font-size: 11px; color: #aaa; margin-top: 2px; }
  @media (min-width: 600px) { .grid { display: block; } }
  .video-title { font-size: 16px; font-weight: 600; margin: 10px 0 6px; word-break: break-word; }
  .video-meta-row { display: flex; gap: 10px; flex-wrap: wrap; color: #aaa; font-size: 12px; padding-bottom: 10px; border-bottom: 1px solid #303030; }
  .channel-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: #212121; }
  .channel-name { font-weight: 500; font-size: 14px; }
  .channel-subs { font-size: 11px; color: #aaa; }
  .desc-box { background: #181818; padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .recs { display: block; }
  .rec { display: flex; gap: 8px; cursor: pointer; padding: 4px; margin-bottom: 8px; }
  .rec-thumb { width: 110px; min-width: 110px; background: #000; border-radius: 6px; overflow: hidden; height: 0; padding-top: 61.875px; position: relative; }
  .rec-thumb img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec-info { flex: 1; min-width: 0; }
  .rec-title { font-size: 12px; font-weight: 500; margin-bottom: 3px; }
  .rec-channel { font-size: 11px; color: #aaa; }
  .empty { text-align: center; padding: 40px 16px; color: #aaa; font-size: 13px; }
  .error { color: #ff6b6b; padding: 12px; background: rgba(255,0,0,.1); border-radius: 8px; margin: 12px 0; font-size: 12px; }
  .toast { position: fixed; bottom: 16px; left: 50%; margin-left: -100px; width: 200px; background: #333; color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 9999; opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s; pointer-events: none; text-align: center; font-size: 12px; }
  .toast.show { opacity: 1; }
  .player-wrap { position: relative; width: 100%; background: #000; border-radius: 6px; overflow: hidden; height: 0; padding-top: 56.25%; }
  .player-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #000; }
  .player-loading { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.7); color: #fff; font-size: 13px; z-index: 30; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .glass-play-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.3); z-index: 15; cursor: pointer; }
  .glass-play-overlay.hidden { display: none; }
  .glass-big-play { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; color: #fff; }
  .glass-big-play svg { width: 28px; height: 28px; margin-left: 3px; }
  .glass-controls { position: absolute; left: 4px; right: 4px; bottom: 4px; display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border-radius: 8px; background: rgba(20,20,20,.85); border: 1px solid rgba(255,255,255,.15); z-index: 20; opacity: 0; pointer-events: none; -webkit-transition: opacity .2s; transition: opacity .2s; }
  .player-wrap.controls-visible .glass-controls { opacity: 1; pointer-events: auto; }
  .progress-row { display: flex; align-items: center; gap: 6px; }
  .progress-bar { flex: 1; height: 20px; position: relative; cursor: pointer; padding: 8px 0; }
  .progress-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: rgba(255,255,255,.25); }
  .progress-fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: #fff; pointer-events: none; width: 0%; }
  .progress-buffer { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: rgba(255,255,255,.4); pointer-events: none; width: 0%; }
  .time-label { font-size: 10px; color: #fff; opacity: .9; white-space: nowrap; }
  .ctrl-row { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .ctrl-btn { width: 30px; height: 30px; border: none; background: transparent; color: #fff; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; -webkit-appearance: none; }
  .ctrl-btn:active { background: rgba(255,255,255,.2); }
  .ctrl-btn svg { width: 16px; height: 16px; }
  .ctrl-spacer { flex: 1; }
  .volume-wrap { display: flex; align-items: center; }
  .volume-slider { display: none; }
  .glass-menu { position: absolute; right: 4px; bottom: 50px; min-width: 140px; max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; background: rgba(20,20,20,.97); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; z-index: 25; padding: 4px; display: none; }
  .glass-menu.open { display: block; }
  .glass-menu h4 { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; opacity: .55; padding: 4px 6px 2px; font-weight: 600; }
  .glass-menu-item { padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #fff; display: block; }
  .glass-menu-item:active { background: rgba(255,255,255,.12); }
  .glass-menu-item.selected { background: rgba(62,166,255,.3); }
  .glass-menu-item.selected::after { content: " ✓"; color: #3ea6ff; font-weight: 700; }
  .glass-menu-divider { height: 1px; background: rgba(255,255,255,.1); margin: 3px 2px; }
  video::cue { background: rgba(0,0,0,.75); color: #fff; font-size: 16px; }
  @media (min-width: 700px) {
    .grid { display: block; }
    .card { display: inline-block; width: 48%; margin-right: 2%; vertical-align: top; }
    .card:nth-child(2n) { margin-right: 0; }
  }
</style>
</head>
<body>

<header>
  <a href="#/" class="logo" onclick="App.goHome(event); return false;">Erdem<span>Tube</span></a>
  <div class="searchbar">
    <input id="searchInput" type="search" placeholder="Ara veya link..." onkeydown="if(event.keyCode===13)App.search()" />
    <button onclick="App.search()">🔍</button>
  </div>
  <div class="header-right">
    <select id="instanceSelect" onchange="App.changeInstance(this.value)"></select>
  </div>
</header>

<main>
  <div id="view-home" class="view active">
    <h2 style="margin-bottom:10px;font-weight:500;font-size:15px;">Popüler</h2>
    <div id="homeGrid" class="grid"></div>
    <div id="homeEmpty" class="empty" style="display:none;">Yükleniyor...</div>
  </div>

  <div id="view-search" class="view">
    <h2 id="searchTitle" style="margin-bottom:10px;font-weight:500;font-size:15px;"></h2>
    <div id="searchGrid" class="grid"></div>
    <div id="searchEmpty" class="empty" style="display:none;">Sonuç bulunamadı.</div>
  </div>

  <div id="view-watch" class="view">
    <div id="playerWrap" class="player-wrap">
      <video id="video" playsinline webkit-playsinline preload="none"></video>

      <div id="playerLoading" class="player-loading" style="display:none;">
        <div class="spinner"></div>
        <span>Yükleniyor...</span>
      </div>

      <div id="glassPlayOverlay" class="glass-play-overlay hidden">
        <div class="glass-big-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <div id="glassControls" class="glass-controls">
        <div class="progress-row">
          <span class="time-label" id="timeCurrent">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-buffer" id="progressBuffer"></div>
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time-label" id="timeDuration">0:00</span>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn" id="btnPlay" title="Oynat">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnSkipBack" title="-10s">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
          <button class="ctrl-btn" id="btnSkipFwd" title="+10s">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <div class="ctrl-spacer"></div>
          <button class="ctrl-btn" id="btnSubtitles" title="Altyazı">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM7.5 15.5H6v-4h1.5v4zm3 0H9v-4h1.5v4zm5 0h-4v-4h1.5v2.5h1v-2.5H14v4zm3 0h-2.5v-4H18v1h-1v2h1v1z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnSettings" title="Ayarlar">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnFullscreen" title="Tam ekran">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>

      <div id="subtitleMenu" class="glass-menu">
        <h4>Altyazı</h4>
        <div id="subtitleList"></div>
      </div>

      <div id="settingsMenu" class="glass-menu">
        <h4>Kalite</h4>
        <div id="qualityList"></div>
        <div class="glass-menu-divider"></div>
        <h4>Hız</h4>
        <div id="speedList"></div>
      </div>
    </div>

    <div id="watchError" class="error" style="display:none;"></div>
    <h1 id="videoTitle" class="video-title"></h1>
    <div class="video-meta-row">
      <span id="viewCount"></span>
      <span id="publishDate"></span>
      <span id="likeCount"></span>
    </div>
    <div class="channel-row">
      <img id="channelAvatar" class="channel-avatar" alt="" />
      <div>
        <div id="channelName" class="channel-name"></div>
        <div id="channelSubs" class="channel-subs"></div>
      </div>
    </div>
    <div id="description" class="desc-box"></div>
    <h3 style="margin:14px 0 8px;font-weight:500;font-size:14px;">Öneriler</h3>
    <div id="recs" class="recs"></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';

// ===== CİHAZ TESPİTİ =====
var ua = navigator.userAgent || '';
var os = 'unknown';
if (/iPhone|iPod|iPad/.test(ua)) os = 'ios';
else if (/Android/.test(ua)) os = 'android';
else if (/Mac/.test(ua)) os = 'macos';
else if (/Windows/.test(ua)) os = 'windows';
else if (/Linux/.test(ua)) os = 'linux';
var isIPhone4S = /iPhone/.test(ua) && Math.min(screen.width, screen.height) === 320;
document.body.setAttribute('data-os', os);
document.body.setAttribute('data-device', isIPhone4S ? 'iphone4s' : os);

// ===== POLYFILL =====
if (!String.prototype.startsWith) String.prototype.startsWith = function(s, p){ return this.indexOf(s, p||0) === (p||0); };
if (!Array.prototype.indexOf) Array.prototype.indexOf = function(s, f){ for(var i=f||0;i<this.length;i++) if(this[i]===s) return i; return -1; };
if (!Element.prototype.remove) Element.prototype.remove = function(){ if(this.parentNode) this.parentNode.removeChild(this); };
if (!window.URL) window.URL = {};
if (!window.URL.createObjectURL) window.URL.createObjectURL = function(b){ return (window.webkitURL||window.URL).createObjectURL(b); };
if (!window.URL.revokeObjectURL) window.URL.revokeObjectURL = function(u){ return (window.webkitURL||window.URL).revokeObjectURL(u); };

function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function addClass(e,c){ if(e && (' '+e.className+' ').indexOf(' '+c+' ')===-1) e.className+=' '+c; }
function removeClass(e,c){ if(e) e.className=(' '+e.className+' ').replace(' '+c+' ',' ').replace(/^\s+|\s+$/g,''); }
function hasClass(e,c){ return e && (' '+e.className+' ').indexOf(' '+c+' ')!==-1; }
function on(e,ev,fn){ if(e){ if(e.addEventListener) e.addEventListener(ev,fn,false); else if(e.attachEvent) e.attachEvent('on'+ev,fn); } }
function fmtNum(n){ if(n==null||isNaN(n))return''; n=Number(n); if(n>=1e9)return(n/1e9).toFixed(1).replace('.0','')+'B'; if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M'; if(n>=1e3)return(n/1e3).toFixed(1).replace('.0','')+'B'; return String(n); }
function fmtDur(s){ if(!s||s<0||!isFinite(s))return'0:00'; var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60); var mm=m<10?'0'+m:m, ss=sec<10?'0'+sec:sec; return h>0?(h+':'+mm+':'+ss):(m+':'+ss); }
function timeAgo(ms){ if(!ms)return''; var d=new Date().getTime()-ms, days=Math.floor(d/86400000); if(days<1)return'bugün'; if(days<7)return days+' gün önce'; if(days<30)return Math.floor(days/7)+' hafta önce'; if(days<365)return Math.floor(days/30)+' ay önce'; return Math.floor(days/365)+' yıl önce'; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function parseUrl(url){ var a=document.createElement('a'); a.href=url; return { href:a.href, hostname:a.hostname, protocol:a.protocol, pathname:a.pathname, search:a.search }; }
function addQuery(url, k, v){ var hi=url.indexOf('#'); var hash=''; if(hi!==-1){ hash=url.substring(hi); url=url.substring(0,hi); } var sep=url.indexOf('?')===-1?'?':'&'; return url+sep+encodeURIComponent(k)+'='+encodeURIComponent(v)+hash; }
function toast(msg){ var t=$('toast'); t.textContent=msg; addClass(t,'show'); if(t._t)clearTimeout(t._t); t._t=setTimeout(function(){ removeClass(t,'show'); },3000); }
function extractYTId(input){ if(!input)return null; if(/^[\w-]{11}$/.test(input))return input; var m1=input.match(/[?&]v=([\w-]{11})/); if(m1)return m1[1]; var m2=input.match(/youtu\.be\/([\w-]{11})/); if(m2)return m2[1]; return null; }

var state = {
  instances: [],
  currentUrl: '',
  currentVideo: null,
  captionTracks: [],
  activeCaptionId: 'off',
  shakaPlayer: null,
  blobUrls: []
};

function absolutize(url){ if(!url)return''; if(url.indexOf('http')===0)return url; return state.currentUrl+url; }

function fetchInstances(){
  return new Promise(function(resolve){
    var xhr = new XMLHttpRequest();
    xhr.open('GET','./invidious-instances.json',true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState===4){
        if(xhr.status>=200 && xhr.status<300){
          try{ var data=JSON.parse(xhr.responseText); var arr=[],i; for(i=0;i<data.length;i++){ if(data[i].cors) arr.push(data[i].url); } state.instances=arr; }catch(e){ state.instances=[]; }
        }
        if(state.instances.length===0) state.instances=['https://yt.chocolatemoo53.com','https://inv.nadeko.net','https://invidious.nerdvpn.de'];
        var sel=$('instanceSelect'), html='', j;
        for(j=0;j<state.instances.length;j++){ var u=state.instances[j], host=u; try{ host=parseUrl(u).hostname||u; }catch(e){} html+='<option value="'+u+'">'+host+'</option>'; }
        sel.innerHTML=html;
        var r=state.instances[Math.floor(Math.random()*state.instances.length)];
        state.currentUrl=r.replace(/\/+$/,'');
        sel.value=r;
        resolve();
      }
    };
    xhr.onerror=function(){
      state.instances=['https://yt.chocolatemoo53.com','https://inv.nadeko.net'];
      $('instanceSelect').innerHTML='<option value="https://yt.chocolatemoo53.com">yt.chocolatemoo53.com</option>';
      state.currentUrl='https://yt.chocolatemoo53.com';
      resolve();
    };
    xhr.send();
  });
}

function changeInstance(url){
  state.currentUrl=url.replace(/\/+$/,'');
  var host=url; try{ host=parseUrl(url).hostname||url; }catch(e){}
  toast('Instance: '+host);
  loadHome();
}

// ===== API =====
function apiGet(path){
  return new Promise(function(resolve,reject){
    var url = state.currentUrl + path;
    var xhr = new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.timeout=20000;
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4){
        if(xhr.status>=200 && xhr.status<300){
          try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ reject(new Error('JSON parse hatası')); }
        } else { reject(new Error('HTTP '+xhr.status)); }
      }
    };
    xhr.onerror=function(){ reject(new Error('Network error')); };
    xhr.ontimeout=function(){ reject(new Error('Timeout')); };
    xhr.send();
  });
}

function apiVideoInfo(vid){ return apiGet('/api/v1/videos/'+vid); }
function apiSearch(q){ return apiGet('/api/v1/search?q='+encodeURIComponent(q)+'&type=video'); }
function apiTrending(){
  return apiGet('/api/v1/trending?region=TR')['catch'](function(){ return apiGet('/api/v1/trending?region=US')['catch'](function(){ return []; }); });
}

// ===== VIEW =====
function showView(name){
  var vs=document.querySelectorAll('.view'),i;
  for(i=0;i<vs.length;i++) removeClass(vs[i],'active');
  addClass($('view-'+name),'active');
  window.scrollTo(0,0);
}

function goHome(e){ if(e)e.preventDefault(); location.hash='#/'; return false; }

// ===== HOME =====
function loadHome(){
  showView('home');
  var grid=$('homeGrid'), empty=$('homeEmpty');
  grid.innerHTML='<div class="empty">Yükleniyor...</div>';
  empty.style.display='none';
  apiTrending().then(function(items){
    if(!items||items.length===0){ grid.innerHTML=''; empty.textContent='Trendler boş.'; empty.style.display='block'; return; }
    var f=[],i;
    for(i=0;i<items.length;i++) if(items[i].type==='video'||items[i].videoId) f.push(items[i]);
    f=f.slice(0,24);
    var html='';
    for(i=0;i<f.length;i++) html+=renderCard(f[i]);
    grid.innerHTML=html;
  })['catch'](function(err){ grid.innerHTML=''; empty.textContent='Trendler yüklenemedi: '+err.message; empty.style.display='block'; });
}

function renderCard(item){
  var vid=item.videoId, title=esc(item.title||''), author=esc(item.author||'');
  var dur=fmtDur(item.lengthSeconds);
  var views=item.viewCount!=null?fmtNum(item.viewCount)+' görüntülenme':'';
  var thumb='';
  if(item.videoThumbnails && item.videoThumbnails[0] && item.videoThumbnails[0].url) thumb=item.videoThumbnails[0].url;
  else thumb='https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg';
  var fb='https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg';
  return '<div class="card" onclick="location.hash=\'#/watch/'+vid+'\'">'+
    '<div class="card-thumb"><img src="'+thumb+'" loading="lazy" alt="" onerror="this.onerror=null;this.src=\''+fb+'\'"/>'+(dur?'<span class="duration">'+dur+'</span>':'')+'</div>'+
    '<div class="card-info"><div class="card-title">'+title+'</div><div class="card-channel">'+author+'</div><div class="card-meta">'+views+'</div></div>'+
    '</div>';
}

// ===== SEARCH =====
function search(){
  var q=$('searchInput').value.replace(/^\s+|\s+$/g,'');
  if(!q) return;
  var vid=extractYTId(q);
  if(vid){ location.hash='#/watch/'+vid; return; }
  showView('search');
  $('searchTitle').textContent='"'+q+'" için sonuçlar';
  var grid=$('searchGrid'), empty=$('searchEmpty');
  grid.innerHTML='<div class="empty">Aranıyor...</div>';
  empty.style.display='none';
  apiSearch(q).then(function(items){
    var v=[],i;
    for(i=0;i<(items||[]).length;i++) if(items[i].type==='video'||items[i].videoId) v.push(items[i]);
    if(v.length===0){ grid.innerHTML=''; empty.textContent='Sonuç bulunamadı.'; empty.style.display='block'; return; }
    v=v.slice(0,40);
    var html='';
    for(i=0;i<v.length;i++) html+=renderCard(v[i]);
    grid.innerHTML=html;
  })['catch'](function(err){ grid.innerHTML=''; empty.textContent='Arama hatası: '+err.message; empty.style.display='block'; });
}

// ===== WATCH =====
function loadWatch(vid){
  showView('watch');
  resetWatch();
  $('playerLoading').style.display='flex';

  apiVideoInfo(vid).then(function(r){
    if(r.error) throw new Error(r.error);
    state.currentVideo=r;

    $('videoTitle').textContent=r.title||'';
    $('viewCount').textContent=r.viewCount!=null?fmtNum(r.viewCount)+' görüntülenme':'';
    $('publishDate').textContent=r.published?timeAgo(r.published*1000):'';
    $('likeCount').textContent=r.likeCount!=null?fmtNum(r.likeCount)+' beğeni':'';
    var av='';
    if(r.authorThumbnails && r.authorThumbnails[1] && r.authorThumbnails[1].url) av=r.authorThumbnails[1].url;
    $('channelAvatar').src=av?absolutize(av):'';
    $('channelName').textContent=r.author||'';
    var sc=r.subCount!=null?fmtNum(r.subCount):'';
    $('channelSubs').textContent=sc?sc+' abone':'';
    $('description').textContent=r.description||'';

    var recs=$('recs'), rh='', rl=(r.recommendedVideos||[]).slice(0,12), i;
    for(i=0;i<rl.length;i++){
      var x=rl[i], rt='';
      if(x.videoThumbnails && x.videoThumbnails[0] && x.videoThumbnails[0].url) rt=x.videoThumbnails[0].url;
      rh+='<div class="rec" onclick="location.hash=\'#/watch/'+x.videoId+'\'"><div class="rec-thumb">'+(rt?'<img src="'+rt+'" loading="lazy" alt=""/>':'')+'</div><div class="rec-info"><div class="rec-title">'+esc(x.title||'')+'</div><div class="rec-channel">'+esc(x.author||'')+'</div></div></div>';
    }
    recs.innerHTML=rh;

    document.title=(r.title||'ErdemTube')+' - ErdemTube';

    return setupPlayer(r);
  }).then(function(){
    $('playerLoading').style.display='none';
  })['catch'](function(err){
    console.error(err);
    $('playerLoading').style.display='none';
    var eb=$('watchError');
    eb.textContent='Video yüklenemedi: '+err.message;
    eb.style.display='block';
  });
}

function resetWatch(){
  var ids=['watchError','videoTitle','viewCount','publishDate','likeCount','channelName','channelSubs','description','recs'];
  for(var i=0;i<ids.length;i++){
    var e=$(ids[i]);
    if(ids[i]==='watchError'){ e.style.display='none'; e.textContent=''; }
    else if(ids[i]==='recs') e.innerHTML='';
    else e.textContent='';
  }
  $('channelAvatar').src='';
  removeClass($('subtitleMenu'),'open');
  removeClass($('settingsMenu'),'open');
}

// ===== PLAYER =====
function setupPlayer(info){
  var video=$('video');

  // Temizlik
  try{ video.pause(); }catch(e){}
  try{ video.removeAttribute('src'); }catch(e){}
  var ss=video.querySelectorAll('source'),i;
  for(i=0;i<ss.length;i++) ss[i].remove();
  var ts=video.querySelectorAll('track');
  for(i=0;i<ts.length;i++) ts[i].remove();

  // Sadece modern cihazlarda load çağır
  if(!isIPhone4S){
    try{ video.load(); }catch(e){}
  }

  // Blob temizle
  for(i=0;i<state.blobUrls.length;i++){ try{ (window.webkitURL||window.URL).revokeObjectURL(state.blobUrls[i]); }catch(e){} }
  state.blobUrls=[];
  state.captionTracks=[];
  state.activeCaptionId='off';

  // Combined MP4 formatını seç (iOS 9 için itag 18 en uyumlu)
  var fs=info.formatStreams||[];
  var combined=null;
  for(i=0;i<fs.length;i++) if(String(fs[i].itag)==='18'){ combined=fs[i]; break; }
  if(!combined) for(i=0;i<fs.length;i++) if(String(fs[i].itag)==='22'){ combined=fs[i]; break; }
  if(!combined) for(i=0;i<fs.length;i++) if((fs[i].type||'').indexOf('video/mp4')===0){ combined=fs[i]; break; }
  if(!combined && fs.length) combined=fs[0];

  if(combined && combined.url){
    var src=absolutize(combined.url);
    video.src=src;
    console.log('[Player] Combined MP4:', src);
  } else {
    // Combined yok, adaptive video dene
    var af=info.adaptiveFormats||[], av=null;
    for(i=0;i<af.length;i++) if((af[i].type||'').indexOf('video/mp4')===0){ av=af[i]; break; }
    if(av && av.url){
      video.src=absolutize(av.url);
      console.log('[Player] Adaptive video:', av.url);
    } else {
      return Promise.reject(new Error('Oynatılabilir format yok.'));
    }
  }

  // Kontrolleri bağla
  bindControls();

  // Modern cihazlarda Shaka dene (iPhone 4S'te atla)
  if(!isIPhone4S && window.shaka && shaka.Player && shaka.Player.isBrowserSupported()){
    var dashUrl = state.currentUrl + '/api/manifest/dash/id/' + info.videoId + '?local=true';
    try{
      shaka.polyfill.installAll();
      var player = new shaka.Player();
      player.attach(video).then(function(){
        return player.load(dashUrl, null, 'application/dash+xml');
      }).then(function(){
        state.shakaPlayer = player;
        buildQualityList(player.getVariantTracks());
        console.log('[Player] DASH yüklendi');
      })['catch'](function(err){
        console.warn('[Player] Shaka başarısız, native kalıyor:', err.message);
      });
    }catch(e){ console.warn('Shaka init:', e.message); }
  }

  buildQualityList([]);

  // Altyazıları arka planda yükle (video bloke olmasın)
  if(!isIPhone4S){
    attachCaptions(info)['catch'](function(err){ console.warn('Altyazı:', err); });
  } else {
    buildSubtitleList();
  }

  buildSpeedList();
  return Promise.resolve(true);
}

// ===== ALTYAZI =====
function attachCaptions(info){
  var caps=info.captions||[];
  if(caps.length===0){ buildSubtitleList(); return Promise.resolve(); }
  var video=$('video');
  var chain=Promise.resolve();
  for(var i=0;i<caps.length;i++){
    (function(cap){
      chain=chain.then(function(){
        var url=cap.url;
        if(url.indexOf('http')!==0) url=state.currentUrl+url;
        url=addQuery(url,'fmt','vtt');
        return new Promise(function(resolve){
          var xhr=new XMLHttpRequest();
          xhr.open('GET',url,true);
          xhr.timeout=8000;
          xhr.onreadystatechange=function(){
            if(xhr.readyState===4){
              if(xhr.status>=200 && xhr.status<300){
                var vtt=xhr.responseText;
                if(vtt && vtt.indexOf('WEBVTT')!==0){
                  vtt='WEBVTT\n\n'+vtt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2').replace(/^\s+|\s+$/g,'');
                }
                if(vtt && vtt.replace(/^\s+|\s+$/g,'')!=='WEBVTT'){
                  try{
                    var blob=new Blob([vtt],{type:'text/vtt; charset=utf-8'});
                    var bu=(window.webkitURL||window.URL).createObjectURL(blob);
                    state.blobUrls.push(bu);
                    state.captionTracks.push({ id:cap.language_code+'_'+Math.random().toString(36).substring(2,7), label:cap.label||cap.language_code, lang:cap.language_code, url:bu });
                  }catch(e){}
                }
              }
              resolve();
            }
          };
          xhr.onerror=function(){ resolve(); };
          xhr.ontimeout=function(){ resolve(); };
          xhr.send();
        });
      });
    })(caps[i]);
  }
  return chain.then(function(){
    for(var j=0;j<state.captionTracks.length;j++){
      var t=state.captionTracks[j];
      var e=document.createElement('track');
      e.kind='subtitles'; e.label=t.label; e.srclang=t.lang; e.src=t.url;
      e.setAttribute('data-cap-id',t.id);
      video.appendChild(e);
    }
    buildSubtitleList();
  });
}

function buildSubtitleList(){
  var list=$('subtitleList');
  if(!list) return;
  if(state.captionTracks.length===0){ list.innerHTML='<div class="glass-menu-item" style="opacity:.5;">Altyazı yok</div>'; return; }
  var html='<div class="glass-menu-item'+(state.activeCaptionId==='off'?' selected':'')+'" data-cap="off">Kapalı</div>';
  for(var i=0;i<state.captionTracks.length;i++){
    var t=state.captionTracks[i];
    html+='<div class="glass-menu-item'+(state.activeCaptionId===t.id?' selected':'')+'" data-cap="'+t.id+'">'+esc(t.label)+'</div>';
  }
  list.innerHTML=html;
  var els=list.querySelectorAll('[data-cap]');
  for(var j=0;j<els.length;j++){ (function(e){ e.onclick=function(){ selectCaption(e.getAttribute('data-cap')); }; })(els[j]); }
}

function selectCaption(id){
  state.activeCaptionId=id;
  var video=$('video'), tracks=video.querySelectorAll('track'), i;
  for(i=0;i<tracks.length;i++){ try{ tracks[i].track.mode='disabled'; }catch(e){} }
  if(id!=='off'){
    for(i=0;i<tracks.length;i++){
      if(tracks[i].getAttribute('data-cap-id')===id){ try{ tracks[i].track.mode='showing'; }catch(e){} }
    }
  }
  buildSubtitleList();
  removeClass($('subtitleMenu'),'open');
}

// ===== KALİTE =====
function buildQualityList(variants){
  var list=$('qualityList');
  if(!list) return;
  if(!variants || variants.length===0){
    var v=$('video').videoHeight;
    list.innerHTML='<div class="glass-menu-item selected">'+(v?v+'p':'Otomatik')+'</div>';
    return;
  }
  var heights=[],i;
  for(i=0;i<variants.length;i++){ var h=variants[i].height; if(h>0 && heights.indexOf(h)===-1) heights.push(h); }
  heights.sort(function(a,b){return b-a;});
  var html='<div class="glass-menu-item'+(state.shakaPlayer?'':' selected')+'" data-q="auto">Otomatik</div>';
  for(i=0;i<heights.length;i++) html+='<div class="glass-menu-item" data-q="'+heights[i]+'">'+heights[i]+'p</div>';
  list.innerHTML=html;
  var els=list.querySelectorAll('[data-q]');
  for(i=0;i<els.length;i++){ (function(e){ e.onclick=function(){ selectQuality(e.getAttribute('data-q')); }; })(els[i]); }
}

function selectQuality(q){
  if(!state.shakaPlayer) return;
  try{
    if(q==='auto') state.shakaPlayer.configure({abr:{enabled:true}});
    else{
      var vs=state.shakaPlayer.getVariantTracks(),h=parseInt(q,10),v=null,i;
      for(i=0;i<vs.length;i++) if(vs[i].height===h){ v=vs[i]; break; }
      if(v){ state.shakaPlayer.configure({abr:{enabled:false}}); state.shakaPlayer.selectVariantTrack(v,true); }
    }
  }catch(e){}
  buildQualityList(state.shakaPlayer.getVariantTracks());
  removeClass($('settingsMenu'),'open');
}

// ===== HIZ =====
function buildSpeedList(){
  var list=$('speedList');
  if(!list) return;
  var speeds=[0.5,0.75,1,1.25,1.5,2], video=$('video'), cur=video.playbackRate;
  var html='';
  for(var i=0;i<speeds.length;i++) html+='<div class="glass-menu-item'+(speeds[i]===cur?' selected':'')+'" data-sp="'+speeds[i]+'">'+speeds[i]+'x</div>';
  list.innerHTML=html;
  var els=list.querySelectorAll('[data-sp]');
  for(var j=0;j<els.length;j++){ (function(e){ e.onclick=function(){ video.playbackRate=parseFloat(e.getAttribute('data-sp')); buildSpeedList(); removeClass($('settingsMenu'),'open'); }; })(els[j]); }
}

// ===== KONTROLLER =====
var controlsBound=false;
function bindControls(){
  if(controlsBound) return;
  controlsBound=true;

  var wrap=$('playerWrap'), overlay=$('glassPlayOverlay'), video=$('video');
  var pb=$('progressBar'), pf=$('progressFill'), pbuf=$('progressBuffer');
  var tc=$('timeCurrent'), td=$('timeDuration'), ip=$('iconPlay');
  var btnPlay=$('btnPlay'), btnBack=$('btnSkipBack'), btnFwd=$('btnSkipFwd');
  var btnSub=$('btnSubtitles'), btnSet=$('btnSettings'), btnFs=$('btnFullscreen');
  var subMenu=$('subtitleMenu'), setMenu=$('settingsMenu');

  var hideTimer=null;
  function showControls(){
    addClass(wrap,'controls-visible');
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer=setTimeout(function(){ if(!video.paused) removeClass(wrap,'controls-visible'); },2500);
  }
  on(wrap,'mousemove',showControls);
  on(wrap,'touchstart',showControls);
  showControls();

  function togglePlay(){
    if(video.paused){ var p=video.play(); if(p&&p['catch']) p['catch'](function(){}); }
    else video.pause();
  }

  on(btnPlay,'click',togglePlay);
  on(overlay,'click',togglePlay);
  on(video,'click',function(){
    if(hasClass(subMenu,'open')||hasClass(setMenu,'open')) return;
    togglePlay();
  });

  on(video,'play',function(){ ip.innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; addClass(overlay,'hidden'); showControls(); });
  on(video,'pause',function(){ ip.innerHTML='<path d="M8 5v14l11-7z"/>'; removeClass(overlay,'hidden'); addClass(wrap,'controls-visible'); });
  on(video,'ended',function(){ ip.innerHTML='<path d="M8 5v14l11-7z"/>'; removeClass(overlay,'hidden'); });

  on(video,'timeupdate',function(){
    var d=video.duration||0, c=video.currentTime||0, pct=d?(c/d)*100:0;
    pf.style.width=pct+'%';
    tc.textContent=fmtDur(c);
  });
  on(video,'durationchange',function(){ td.textContent=fmtDur(video.duration); });
  on(video,'progress',function(){
    if(video.buffered.length && video.duration){
      var be=video.buffered.end(video.buffered.length-1);
      pbuf.style.width=(be/video.duration*100)+'%';
    }
  });

  function seek(e){
    var rect=pb.getBoundingClientRect();
    var cx=e.touches?e.touches[0].clientX:e.clientX;
    var x=cx-rect.left, pct=Math.max(0,Math.min(1,x/rect.width));
    if(video.duration) video.currentTime=pct*video.duration;
  }
  var seeking=false;
  on(pb,'mousedown',function(e){ seeking=true; seek(e); });
  on(window,'mousemove',function(e){ if(seeking) seek(e); });
  on(window,'mouseup',function(){ seeking=false; });
  on(pb,'touchstart',function(e){ seek(e); if(e.preventDefault)e.preventDefault(); });
  on(pb,'touchmove',function(e){ seek(e); if(e.preventDefault)e.preventDefault(); });

  on(btnBack,'click',function(){ video.currentTime=Math.max(0,video.currentTime-10); });
  on(btnFwd,'click',function(){ video.currentTime=Math.min(video.duration||0,video.currentTime+10); });

  on(btnSub,'click',function(e){ if(e.stopPropagation)e.stopPropagation(); removeClass(setMenu,'open'); if(hasClass(subMenu,'open')) removeClass(subMenu,'open'); else addClass(subMenu,'open'); });
  on(btnSet,'click',function(e){ if(e.stopPropagation)e.stopPropagation(); removeClass(subMenu,'open'); if(hasClass(setMenu,'open')) removeClass(setMenu,'open'); else addClass(setMenu,'open'); });
  on(document,'click',function(e){
    var t=e.target||e.srcElement;
    if(!subMenu.contains(t) && t!==btnSub) removeClass(subMenu,'open');
    if(!setMenu.contains(t) && t!==btnSet) removeClass(setMenu,'open');
  });

  on(btnFs,'click',function(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(wrap.requestFullscreen){ wrap.requestFullscreen(); }
    else if(wrap.webkitRequestFullscreen){ wrap.webkitRequestFullscreen(); }
    else if(video.webkitEnterFullscreen){ video.webkitEnterFullscreen(); }
  });

  on(document,'keydown',function(e){
    var tag=document.activeElement?document.activeElement.tagName:'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    if(!hasClass($('view-watch'),'active')) return;
    var k=e.key||e.keyCode;
    if(k===' '||k==='k'||k===32){ if(e.preventDefault)e.preventDefault(); togglePlay(); }
    else if(k==='ArrowLeft'||k===37) video.currentTime=Math.max(0,video.currentTime-5);
    else if(k==='ArrowRight'||k===39) video.currentTime=Math.min(video.duration||0,video.currentTime+5);
    else if(k==='f'||k===70) btnFs.click();
    else if(k==='m'||k===77) video.muted=!video.muted;
    else if(k==='c'||k===67) btnSub.click();
  });
}

// ===== ROUTER =====
function handleRoute(){
  var hash=location.hash||'#/';
  var m=hash.match(/^#\/watch\/([\w-]{11})/);
  if(m) loadWatch(m[1]);
  else loadHome();
}

function init(){
  fetchInstances().then(function(){
    on(window,'hashchange',handleRoute);
    handleRoute();
  });
}

// Global API
window.App={
  init: init,
  search: search,
  goHome: goHome,
  changeInstance: changeInstance,
  loadHome: loadHome
};

// Başlat
if(document.readyState==='complete'||document.readyState==='interactive'){ setTimeout(init,0); }
else{ on(document,'DOMContentLoaded',init); }

})();
</script>
