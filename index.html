<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ErdemTube</title>
<style>
  :root {
    --bg: #0f0f0f; --bg2: #181818; --bg3: #212121;
    --fg: #f1f1f1; --fg2: #aaa; --accent: #f00; --border: #303030;
    --radius: 12px;
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Roboto", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--bg2); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border); }
  .logo { font-size: 22px; font-weight: 700; color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .logo span { color: var(--accent); }
  .searchbar { flex: 1; display: flex; max-width: 600px; margin: 0 auto; }
  .searchbar input { flex: 1; padding: 10px 16px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 20px 0 0 20px; font-size: 15px; outline: none; }
  .searchbar input:focus { border-color: #3ea6ff; }
  .searchbar button { padding: 10px 20px; border: 1px solid var(--border); border-left: none; background: var(--bg3); color: var(--fg); border-radius: 0 20px 20px 0; cursor: pointer; font-size: 15px; }
  .header-right select { padding: 8px 12px; background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }

  main { padding: 20px; max-width: 1600px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { cursor: pointer; border-radius: var(--radius); overflow: hidden; background: var(--bg2); transition: transform .15s; }
  .card:hover { transform: scale(1.02); }
  .card-thumb { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-thumb .duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.85); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .card-info { padding: 12px; }
  .card-title { font-weight: 500; font-size: 14px; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-channel { font-size: 13px; color: var(--fg2); }
  .card-meta { font-size: 12px; color: var(--fg2); margin-top: 2px; }

  .watch-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
  @media (max-width: 1100px) { .watch-layout { grid-template-columns: 1fr; } }
  .video-title { font-size: 20px; font-weight: 600; margin: 16px 0 8px; }
  .video-meta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--fg2); font-size: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .channel-row { display: flex; align-items: center; gap: 12px; padding: 16px 0; }
  .channel-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg3); object-fit: cover; }
  .channel-name { font-weight: 500; font-size: 15px; }
  .channel-subs { font-size: 12px; color: var(--fg2); }
  .desc-box { background: var(--bg2); padding: 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .recs { display: flex; flex-direction: column; gap: 12px; }
  .rec { display: flex; gap: 12px; cursor: pointer; border-radius: 8px; padding: 4px; }
  .rec:hover { background: var(--bg2); }
  .rec-thumb { width: 160px; min-width: 160px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
  .rec-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .rec-info { flex: 1; min-width: 0; }
  .rec-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rec-channel { font-size: 12px; color: var(--fg2); }
  .empty { text-align: center; padding: 80px 20px; color: var(--fg2); }
  .error { color: #ff6b6b; padding: 20px; background: rgba(255,0,0,.1); border-radius: var(--radius); margin: 20px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); user-select: none; }
  .player-wrap video { width: 100%; height: 100%; display: block; background: #000; }
  .player-wrap.controls-visible { cursor: default; }
  .player-wrap:not(.controls-visible) { cursor: none; }

  .player-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.7); color: #fff; font-size: 14px; z-index: 30; gap: 12px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .glass-play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(0,0,0,.2) 0%, rgba(0,0,0,.5) 100%); z-index: 15; cursor: pointer; transition: opacity .3s; }
  .glass-play-overlay.hidden { opacity: 0; pointer-events: none; }
  .glass-big-play { width: 84px; height: 84px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; color: #fff; transition: transform .2s, background .2s; }
  .glass-big-play:hover { transform: scale(1.08); background: rgba(255,255,255,.16); }
  .glass-big-play svg { width: 36px; height: 36px; margin-left: 4px; }

  .glass-controls { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(20,20,20,.35); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.15); z-index: 20; transform: translateY(20px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  .player-wrap.controls-visible .glass-controls { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; position: relative; cursor: pointer; border-radius: 3px; background: rgba(255,255,255,.2); padding: 8px 0; margin: -8px 0; }
  .progress-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%); border-radius: 3px; background: rgba(255,255,255,.2); }
  .progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 6px; border-radius: 3px; background: #fff; pointer-events: none; width: 0%; }
  .progress-buffer { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); pointer-events: none; width: 0%; }
  .progress-knob { position: absolute; top: 50%; width: 14px; height: 14px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(0); pointer-events: none; transition: transform .15s; box-shadow: 0 0 0 4px rgba(255,255,255,.2); }
  .progress-bar:hover .progress-knob { transform: translate(-50%, -50%) scale(1); }
  .time-label { font-size: 12px; color: #fff; opacity: .9; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .ctrl-row { display: flex; align-items: center; gap: 4px; }
  .ctrl-btn { width: 36px; height: 36px; border: none; background: transparent; color: #fff; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  .ctrl-btn:hover { background: rgba(255,255,255,.14); }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .ctrl-spacer { flex: 1; }

  .volume-wrap { display: flex; align-items: center; gap: 6px; }
  .volume-slider { width: 0; overflow: hidden; transition: width .2s; display: flex; align-items: center; }
  .volume-wrap:hover .volume-slider { width: 80px; }
  .volume-slider input { width: 80px; -webkit-appearance: none; height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; outline: none; }
  .volume-slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }

  .glass-menu { position: absolute; right: 12px; bottom: 90px; min-width: 220px; max-height: 380px; overflow-y: auto; background: rgba(20,20,20,.6); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 14px; box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.15); z-index: 25; padding: 8px; display: none; }
  .glass-menu.open { display: block; }
  .glass-menu h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .55; padding: 8px 10px 4px; font-weight: 600; }
  .glass-menu-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 8px; transition: background .12s; }
  .glass-menu-item:hover { background: rgba(255,255,255,.12); }
  .glass-menu-item.selected { background: rgba(62,166,255,.25); }
  .glass-menu-item.selected::after { content: "✓"; margin-left: auto; color: #3ea6ff; font-weight: 700; }
  .glass-menu-divider { height: 1px; background: rgba(255,255,255,.1); margin: 6px 4px; }

  video::cue { background: rgba(0,0,0,.75); color: #fff; font-family: "Roboto", sans-serif; font-size: 20px; text-shadow: 0 1px 3px rgba(0,0,0,.9); padding: 4px 8px; }
</style>
</head>
<body>

<header>
  <a href="#/" class="logo" onclick="App.goHome(event)">Erdem<span>Tube</span></a>
  <div class="searchbar">
    <input id="searchInput" placeholder="Ara veya video linki yapıştır..." onkeydown="if(event.key==='Enter')App.search()" />
    <button onclick="App.search()">🔍</button>
  </div>
  <div class="header-right">
    <select id="instanceSelect" onchange="App.changeInstance(this.value)"></select>
  </div>
</header>

<main>
  <div id="view-home" class="view active">
    <h2 style="margin-bottom:16px;font-weight:500;">Popüler</h2>
    <div id="homeGrid" class="grid"></div>
    <div id="homeEmpty" class="empty" style="display:none;">Yükleniyor...</div>
  </div>

  <div id="view-search" class="view">
    <h2 id="searchTitle" style="margin-bottom:16px;font-weight:500;"></h2>
    <div id="searchGrid" class="grid"></div>
    <div id="searchEmpty" class="empty" style="display:none;">Sonuç bulunamadı.</div>
  </div>

  <div id="view-watch" class="view">
    <div class="watch-layout">
      <div>
        <div id="playerWrap" class="player-wrap">
          <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>

          <div id="playerLoading" class="player-loading" style="display:none;">
            <div class="spinner"></div>
            <span>Yükleniyor...</span>
          </div>

          <div id="glassPlayOverlay" class="glass-play-overlay hidden">
            <div class="glass-big-play">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>

          <div id="glassControls" class="glass-controls">
            <div class="progress-row">
              <span class="time-label" id="timeCurrent">0:00</span>
              <div class="progress-bar" id="progressBar">
                <div class="progress-buffer" id="progressBuffer"></div>
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-knob" id="progressKnob"></div>
              </div>
              <span class="time-label" id="timeDuration">0:00</span>
            </div>
            <div class="ctrl-row">
              <button class="ctrl-btn" id="btnPlay" title="Oynat/Duraklat">
                <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnSkipBack" title="10s geri">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              </button>
              <button class="ctrl-btn" id="btnSkipFwd" title="10s ileri">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
              <div class="volume-wrap">
                <button class="ctrl-btn" id="btnMute" title="Sessiz">
                  <svg id="iconVolume" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <div class="volume-slider">
                  <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="1" />
                </div>
              </div>
              <div class="ctrl-spacer"></div>
              <button class="ctrl-btn" id="btnSubtitles" title="Altyazı">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM7.5 15.5H6v-4h1.5v4zm3 0H9v-4h1.5v4zm5 0h-4v-4h1.5v2.5h1v-2.5H14v4zm3 0h-2.5v-4H18v1h-1v2h1v1z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnSettings" title="Ayarlar">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnFullscreen" title="Tam ekran">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              </button>
            </div>
          </div>

          <div id="subtitleMenu" class="glass-menu">
            <h4>Altyazı</h4>
            <div id="subtitleList"></div>
          </div>

          <div id="settingsMenu" class="glass-menu">
            <h4>Kalite</h4>
            <div id="qualityList"></div>
            <div class="glass-menu-divider"></div>
            <h4>Ses</h4>
            <div id="audioList"></div>
            <div class="glass-menu-divider"></div>
            <h4>Hız</h4>
            <div id="speedList"></div>
          </div>
        </div>

        <div id="watchError" class="error" style="display:none;"></div>
        <h1 id="videoTitle" class="video-title"></h1>
        <div class="video-meta-row">
          <span id="viewCount"></span>
          <span id="publishDate"></span>
          <span id="likeCount"></span>
        </div>
        <div class="channel-row">
          <img id="channelAvatar" class="channel-avatar" alt="" />
          <div>
            <div id="channelName" class="channel-name"></div>
            <div id="channelSubs" class="channel-subs"></div>
          </div>
        </div>
        <div id="description" class="desc-box"></div>
      </div>
      <div>
        <h3 style="margin-bottom:12px;font-weight:500;">Öneriler</h3>
        <div id="recs" class="recs"></div>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>

<script>
const App = (() => {
  const state = {
    instances: [],
    currentInstance: '',
    currentInstanceUrl: '',
    currentVideo: null,
    shakaPlayer: null,
    captionTracks: [],   // { id, label, lang, url }
    activeCaptionId: 'off',
    variants: [],
    currentQuality: 'auto',
    blobUrls: [],
    audioTracks: [],     // { id, label, lang, bitrate, url, isDefault }
    activeAudioId: null,
  };

  // ===== UTILS =====
  function randomArrayItem(a){ return a[Math.floor(Math.random()*a.length)]; }
  function formatNumber(n){ if(n==null||isNaN(n))return''; try{return new Intl.NumberFormat('tr-TR',{notation:'compact'}).format(n);}catch{return String(n);} }
  function formatDuration(s){ if(!s||s<0||!isFinite(s))return'0:00'; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60); return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`; }
  function timeAgo(ms){ if(!ms)return''; const d=Date.now()-ms; const days=Math.floor(d/86400000); if(days<1)return'bugün'; if(days<7)return`${days} gün önce`; if(days<30)return`${Math.floor(days/7)} hafta önce`; if(days<365)return`${Math.floor(days/30)} ay önce`; return`${Math.floor(days/365)} yıl önce`; }
  function showToast(msg,d=3000){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),d); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function absolutizeUrl(url){ if(!url)return''; if(url.startsWith('http'))return url; return state.currentInstanceUrl+url; }
  function extractVideoId(input){ if(!input)return null; if(/^[\w-]{11}$/.test(input))return input; try{ const u=new URL(input); if(u.hostname.includes('youtu.be'))return u.pathname.slice(1); if(u.searchParams.get('v'))return u.searchParams.get('v'); }catch{} return null; }
  function cleanupBlobs(){ state.blobUrls.forEach(u=>{ try{URL.revokeObjectURL(u);}catch{} }); state.blobUrls = []; }

  // ===== INSTANCES =====
  async function fetchInvidiousInstances(){
    try{
      const res = await fetch('./invidious-instances.json');
      const data = await res.json();
      state.instances = data.filter(i=>i.cors).map(i=>i.url);
    }catch(err){
      console.warn('instances.json yüklenemedi', err);
      state.instances = ['https://yt.chocolatemoo53.com'];
    }
    if(state.instances.length===0) state.instances = ['https://yt.chocolatemoo53.com'];
    const sel = document.getElementById('instanceSelect');
    sel.innerHTML = state.instances.map(u=>{
      let host=''; try{host=new URL(u).hostname;}catch{host=u;}
      return `<option value="${u}">${host}</option>`;
    }).join('');
    setRandomCurrentInvidiousInstance();
  }
  function setRandomCurrentInvidiousInstance(){ setCurrentInvidiousInstance(randomArrayItem(state.instances)); }
  function setCurrentInvidiousInstance(url){
    state.currentInstance = url;
    let parsed; try{parsed = new URL(url);}catch{parsed=null;}
    let instanceUrl = url;
    if(parsed && (parsed.username||parsed.password)){
      parsed.username=''; parsed.password='';
      instanceUrl = parsed.toString().replace(/\/$/,'');
    }
    state.currentInstanceUrl = instanceUrl.replace(/\/$/,'');
    const sel = document.getElementById('instanceSelect'); if(sel) sel.value = url;
  }
  function changeInstance(url){ setCurrentInvidiousInstance(url); showToast(`Instance: ${new URL(url).hostname}`); loadHome(); }

  // ===== INVIDIOUS API =====
  async function invidiousGetVideoInformation(videoId){
    const url = `${state.currentInstanceUrl}/api/v1/videos/${videoId}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }
  async function invidiousSearch(q){
    const url = `${state.currentInstanceUrl}/api/v1/search?q=${encodeURIComponent(q)}&type=video`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }
  async function invidiousTrending(){
    const url = `${state.currentInstanceUrl}/api/v1/trending?region=TR`;
    const res = await fetch(url);
    if(!res.ok){
      const url2 = `${state.currentInstanceUrl}/api/v1/trending?region=US`;
      const res2 = await fetch(url2);
      if(!res2.ok) return [];
      return await res2.json();
    }
    return await res.json();
  }

  // ===== VIEW =====
  function showView(name){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(`view-${name}`).classList.add('active');
    window.scrollTo(0,0);
  }

  // =====================================================
  // ============ YENİDEN YAZILAN PLAYER ================
  // =====================================================
  async function setupPlayer(videoInfo){
    const videoEl = document.getElementById('video');

    // Temizlik
    if(state.shakaPlayer){
      try{ await state.shakaPlayer.destroy(); }catch{}
      state.shakaPlayer = null;
    }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.querySelectorAll('source').forEach(s=>s.remove());
    videoEl.querySelectorAll('track').forEach(t=>t.remove());
    videoEl.load();

    // Önceki videodan kalan harici ses elementini temizle
    if(audioSyncEl){ try{audioSyncEl.pause();audioSyncEl.remove();}catch{} audioSyncEl = null; }

    // Altyazı blob url'lerini temizle
    cleanupBlobs();
    state.captionTracks = [];
    state.variants = [];
    state.currentQuality = 'auto';
    state.activeCaptionId = 'off';
    state.audioTracks = [];
    state.activeAudioId = null;

    // ===== SES + GÖRÜNTÜ: Invidious adaptiveFormats'ten yedek plan =====
    const fallback = buildFallbackUrl(videoInfo);

    // ===== STRATEJİ 1: DASH (Shaka ile) =====
    const dashUrl = `${state.currentInstanceUrl}/api/manifest/dash/id/${videoInfo.videoId}?local=true`;
    try{
      await loadWithShaka(dashUrl, 'application/dash+xml');
      console.log('[Player] DASH yüklendi ✅');
      state.variants = state.shakaPlayer.getVariantTracks();
      buildQualityList(state.variants);
      finishPlayerSetup(videoInfo);
      return;
    }catch(err){
      console.warn('[Player] DASH başarısız:', err.message);
    }

    // ===== STRATEJİ 2: HLS =====
    if(videoInfo.hlsUrl){
      try{
        await loadWithShaka(videoInfo.hlsUrl, 'application/x-mpegurl');
        console.log('[Player] HLS yüklendi ✅');
        state.variants = state.shakaPlayer?.getVariantTracks() || [];
        buildQualityList(state.variants);
        finishPlayerSetup(videoInfo);
        return;
      }catch(err){
        console.warn('[Player] HLS başarısız:', err.message);
      }
    }

    // ===== STRATEJİ 3: adaptive video + adaptive audio =====
    if(fallback.videoUrl){
      try{
        videoEl.src = fallback.videoUrl;
        videoEl.muted = false;
        if(fallback.audioUrl){
          attachAudioTrack(fallback.audioUrl);
        }
        await videoEl.play().catch(()=>{});
        console.log('[Player] Adaptive (video+audio ayrı) yüklendi ✅');
        buildQualityList([]);
        finishPlayerSetup(videoInfo);
        return;
      }catch(err){
        console.warn('[Player] adaptive fallback başarısız:', err.message);
      }
    }

    // ===== STRATEJİ 4: Combined MP4 =====
    const combined = (videoInfo.formatStreams||[]).find(f=>f.itag==='18') || (videoInfo.formatStreams||[])[0];
    if(combined?.url){
      try{
        videoEl.src = absolutizeUrl(combined.url);
        await videoEl.play().catch(()=>{});
        console.log('[Player] Combined MP4 yüklendi ✅');
        buildQualityList([]);
        finishPlayerSetup(videoInfo);
        return;
      }catch(err){
        console.warn('[Player] combined mp4 başarısız:', err.message);
      }
    }

    throw new Error('Hiçbir format oynatılamadı.');
  }

  async function loadWithShaka(url, mime){
    if(!shaka.Player.isBrowserSupported()) throw new Error('Shaka yok');
    shaka.polyfill.installAll();
    const videoEl = document.getElementById('video');
    const player = new shaka.Player();
    await player.attach(videoEl);
    player.addEventListener('error', e=>console.error('Shaka error:', e.detail));
    await player.load(url, null, mime);
    state.shakaPlayer = player;
  }

  // Invidious adaptiveFormats'ten video ve ses ayrı ayrı çek
  function buildFallbackUrl(videoInfo){
    const adaptive = videoInfo.adaptiveFormats || [];
    let videoUrl = null;
    const videos = adaptive.filter(f => (f.type||'').startsWith('video/mp4'));
    if(videos.length){
      const best = videos.sort((a,b)=>parseInt(b.bitrate||0)-parseInt(a.bitrate||0))[0];
      videoUrl = absolutizeUrl(best.url);
    }
    let audioUrl = null;
    const audios = adaptive.filter(f => (f.type||'').startsWith('audio/mp4') || (f.type||'').startsWith('audio/m4a'));
    if(audios.length){
      const best = audios.sort((a,b)=>parseInt(b.bitrate||0)-parseInt(a.bitrate||0))[0];
      audioUrl = absolutizeUrl(best.url);
    }
    return { videoUrl, audioUrl };
  }

  // ===== SES PARÇALARI =====
  function buildAudioTracks(videoInfo){
    const adaptive = videoInfo.adaptiveFormats || [];
    const audios = adaptive.filter(f =>
      (f.type||'').startsWith('audio/mp4') ||
      (f.type||'').startsWith('audio/m4a') ||
      (f.type||'').startsWith('audio/webm')
    );

    // Dil/track'e göre grupla, her grup için en yüksek bitrate'i al
    const grouped = {};
    for(const a of audios){
      const lang = a.audioTrack?.id || a.audio_track?.id || a.language || 'und';
      const displayName = a.audioTrack?.display_name || a.audio_track?.display_name || a.language || 'Varsayılan';
      const key = lang + '|' + displayName;
      const bitrate = parseInt(a.bitrate||0);
      if(!grouped[key] || bitrate > grouped[key].bitrate){
        grouped[key] = {
          id: key,
          lang,
          label: displayName,
          bitrate,
          url: absolutizeUrl(a.url),
          isDefault: !!(a.audioTrack?.audio_is_default || a.audio_track?.audio_is_default),
        };
      }
    }

    state.audioTracks = Object.values(grouped).sort((a,b)=>b.bitrate - a.bitrate);

    // Varsayılan: isDefault olan ya da en yüksek bitrate
    if(state.audioTracks.length > 0){
      const defaultTrack = state.audioTracks.find(t=>t.isDefault) || state.audioTracks[0];
      state.activeAudioId = defaultTrack.id;
    }

    buildAudioList();
  }

  function buildAudioList(){
    const list = document.getElementById('audioList');
    if(!list) return;

    if(state.audioTracks.length === 0){
      list.innerHTML = `<div class="glass-menu-item" style="opacity:.5;cursor:default;">Tek ses parçası</div>`;
      return;
    }

    list.innerHTML = state.audioTracks.map(t => {
      const isSelected = state.activeAudioId === t.id;
      const bitrateLabel = t.bitrate ? ` • ${Math.round(t.bitrate/1000)}kbps` : '';
      const label = `${escapeHtml(t.label)}${bitrateLabel}`;
      return `<div class="glass-menu-item ${isSelected?'selected':''}" data-audio="${escapeHtml(t.id)}">${label}</div>`;
    }).join('');

    list.querySelectorAll('[data-audio]').forEach(el=>{
      el.onclick = ()=> selectAudio(el.dataset.audio);
    });
  }

  function selectAudio(id){
    if(state.activeAudioId === id) {
      document.getElementById('settingsMenu').classList.remove('open');
      return;
    }
    const track = state.audioTracks.find(t=>t.id === id);
    if(!track) return;

    state.activeAudioId = id;
    const videoEl = document.getElementById('video');

    // Mevcut audio element'i varsa durdur
    if(audioSyncEl){ try{audioSyncEl.pause();audioSyncEl.remove();}catch{} audioSyncEl = null; }

    if(track.url){
      videoEl.muted = true;
      attachAudioTrack(track.url);
      if(!videoEl.paused) audioSyncEl?.play().catch(()=>{});
    }

    buildAudioList();
    document.getElementById('settingsMenu').classList.remove('open');
    showToast(`Ses: ${track.label}`);
  }

  // Video element'i ile ayrı audio element'ini senkronla
  let audioSyncEl = null;
  function attachAudioTrack(audioUrl){
    const videoEl = document.getElementById('video');
    if(audioSyncEl){ try{audioSyncEl.pause();audioSyncEl.remove();}catch{} audioSyncEl = null; }
    const a = document.createElement('audio');
    a.src = audioUrl;
    a.preload = 'auto';
    a.style.display = 'none';
    document.body.appendChild(a);
    audioSyncEl = a;

    function sync(){
      if(videoEl.paused){ if(!a.paused) a.pause(); }
      else { if(a.paused) a.play().catch(()=>{}); }
      if(Math.abs(videoEl.currentTime - a.currentTime) > 0.3){
        a.currentTime = videoEl.currentTime;
      }
    }
    videoEl.addEventListener('play', sync);
    videoEl.addEventListener('pause', sync);
    videoEl.addEventListener('seeked', ()=>{ a.currentTime = videoEl.currentTime; });
    videoEl.addEventListener('timeupdate', ()=>{
      if(!a.paused && Math.abs(videoEl.currentTime - a.currentTime) > 0.5){
        a.currentTime = videoEl.currentTime;
      }
    });
    const origVolumeChange = ()=>{ a.volume = videoEl.muted ? 0 : videoEl.volume; a.muted = videoEl.muted; };
    videoEl.addEventListener('volumechange', origVolumeChange);
    a.volume = videoEl.volume;
    a.muted = videoEl.muted;
    // Video oynuyorsa sesi de başlat
    if(!videoEl.paused) a.play().catch(()=>{});
  }

  function finishPlayerSetup(videoInfo){
    // Ses parçalarını hazırla
    buildAudioTracks(videoInfo);
    // Altyazıları yükle
    attachCaptionTracks(videoInfo).then(()=>{
      buildSubtitleList();
    });
    buildSpeedList();
    bindPlayerControls(document.getElementById('video'));

  // ===== ALTYAZI =====
  async function attachCaptionTracks(videoInfo){
    const videoEl = document.getElementById('video');
    const caps = videoInfo.captions || [];
    if(caps.length === 0){
      state.captionTracks = [];
      return;
    }

    for(const cap of caps){
      try{
        let url = cap.url;
        if(!url.startsWith('http')) url = state.currentInstanceUrl + url;
        const u = new URL(url);
        u.searchParams.set('fmt','vtt');
        url = u.toString();

        const res = await fetch(url);
        if(!res.ok){
          console.warn('Altyazı HTTP', res.status, cap.language_code);
          continue;
        }
        let vtt = await res.text();

        if(!vtt.trim().startsWith('WEBVTT')){
          vtt = convertToVtt(vtt);
        }
        if(!vtt.trim() || vtt.trim() === 'WEBVTT') continue;

        const blob = new Blob([vtt], {type:'text/vtt; charset=utf-8'});
        const blobUrl = URL.createObjectURL(blob);
        state.blobUrls.push(blobUrl);

        state.captionTracks.push({
          id: cap.language_code + '_' + Math.random().toString(36).slice(2,8),
          label: cap.label || cap.language_code,
          lang: cap.language_code,
          url: blobUrl,
        });
      }catch(err){
        console.warn('Altyazı yüklenemedi:', cap.language_code, err.message);
      }
    }

    for(const t of state.captionTracks){
      const el = document.createElement('track');
      el.kind = 'subtitles';
      el.label = t.label;
      el.srclang = t.lang;
      el.src = t.url;
      el.dataset.captionId = t.id;
      videoEl.appendChild(el);
    }
    for(const trackEl of videoEl.querySelectorAll('track')){
      trackEl.track.mode = 'disabled';
    }
  }

  function convertToVtt(text){
    let t = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    t = t.replace(/^\d+\s*$/gm, '');
    t = t.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    if(!t.trim().startsWith('WEBVTT')){
      t = 'WEBVTT\n\n' + t.trim();
    }
    return t;
  }

  function buildSubtitleList(){
    const list = document.getElementById('subtitleList');

    const items = [`<div class="glass-menu-item ${state.activeCaptionId==='off'?'selected':''}" data-cap="off">Kapalı</div>`];

    list.querySelectorAll('[data-cap]').forEach(el=>{

  function selectCaption(id){

  // ===== KALİTE =====
  function buildQualityList(variants){
    const list = document.getElementById('qualityList');
    if(!variants || variants.length===0){
      const v = document.getElementById('video').videoHeight;
      list.innerHTML = `<div class="glass-menu-item selected">${v?v+'p':'Otomatik'}</div>`;
      return;
    }
    const heights = [...new Set(variants.map(v=>v.height).filter(h=>h>0))].sort((a,b)=>b-a);
    const items = [`<div class="glass-menu-item ${state.currentQuality==='auto'?'selected':''}" data-q="auto">Otomatik</div>`];
    for(const h of heights){
      items.push(`<div class="glass-menu-item ${state.currentQuality===String(h)?'selected':''}" data-q="${h}">${h}p</div>`);
    }
    list.innerHTML = items.join('');
    list.querySelectorAll('[data-q]').forEach(el=>{
      el.onclick = ()=> selectQuality(el.dataset.q);
    });
  }

  function selectQuality(q){
    state.currentQuality = q;
    if(state.shakaPlayer){
      const variants = state.shakaPlayer.getVariantTracks();
      if(q==='auto'){
        state.shakaPlayer.configure({abr:{enabled:true}});
      } else {
        const heightNum = parseInt(q);
        const variant = variants.find(v=>v.height===heightNum);
        if(variant){
          state.shakaPlayer.configure({abr:{enabled:false}});
          state.shakaPlayer.selectVariantTrack(variant, true);
        }
      }
    }
    buildQualityList(state.shakaPlayer?.getVariantTracks()||[]);
    document.getElementById('settingsMenu').classList.remove('open');
  }

  // ===== CUSTOM CONTROLS =====
  let controlsBound = false;
  function bindPlayerControls(videoEl){
    if(controlsBound) return;
    controlsBound = true;

    const wrap = document.getElementById('playerWrap');
    const playOverlay = document.getElementById('glassPlayOverlay');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const progressBuffer = document.getElementById('progressBuffer');
    const progressKnob = document.getElementById('progressKnob');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');
    const iconPlay = document.getElementById('iconPlay');
    const btnPlay = document.getElementById('btnPlay');
    const btnSkipBack = document.getElementById('btnSkipBack');
    const btnSkipFwd = document.getElementById('btnSkipFwd');
    const btnMute = document.getElementById('btnMute');
    const iconVolume = document.getElementById('iconVolume');
    const volumeRange = document.getElementById('volumeRange');
    const btnSubtitles = document.getElementById('btnSubtitles');
    const btnSettings = document.getElementById('btnSettings');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const subtitleMenu = document.getElementById('subtitleMenu');
    const settingsMenu = document.getElementById('settingsMenu');

    let hideTimer;
    function showControls(){
      wrap.classList.add('controls-visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(()=>{
        if(!videoEl.paused) wrap.classList.remove('controls-visible');
      }, 2500);
    }
    wrap.addEventListener('mousemove', showControls);
    wrap.addEventListener('mouseleave', ()=>{ if(!videoEl.paused) wrap.classList.remove('controls-visible'); });
    showControls();

    function togglePlay(){
      if(videoEl.paused){ videoEl.play().catch(()=>{}); }
      else videoEl.pause();
    }
    btnPlay.onclick = togglePlay;
    playOverlay.onclick = togglePlay;
    videoEl.addEventListener('click', ()=>{
      if(subtitleMenu.classList.contains('open')||settingsMenu.classList.contains('open')) return;
      togglePlay();
    });

    videoEl.addEventListener('play', ()=>{
      iconPlay.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      playOverlay.classList.add('hidden');
      showControls();
    });
    videoEl.addEventListener('pause', ()=>{
      iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>';
      playOverlay.classList.remove('hidden');
      wrap.classList.add('controls-visible');
    });
    videoEl.addEventListener('ended', ()=>{
      iconPlay.innerHTML = '<path d="M8 5v14l11-7z"/>';
      playOverlay.classList.remove('hidden');
    });

    function fmt(t){ if(!t||!isFinite(t))return'0:00'; return formatDuration(t); }
    videoEl.addEventListener('timeupdate', ()=>{
      const d = videoEl.duration||0;
      const c = videoEl.currentTime||0;
      const pct = d? (c/d)*100 : 0;
      progressFill.style.width = pct+'%';
      progressKnob.style.left = pct+'%';
      timeCurrent.textContent = fmt(c);
    });
    videoEl.addEventListener('durationchange', ()=>{
      timeDuration.textContent = fmt(videoEl.duration);
    });
    videoEl.addEventListener('progress', ()=>{
      if(videoEl.buffered.length && videoEl.duration){
        const bufferedEnd = videoEl.buffered.end(videoEl.buffered.length-1);
        progressBuffer.style.width = (bufferedEnd/videoEl.duration*100)+'%';
      }
    });

    function seekFromEvent(e){
      const rect = progressBar.getBoundingClientRect();
      const x = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
      const pct = Math.max(0, Math.min(1, x/rect.width));
      if(videoEl.duration) videoEl.currentTime = pct*videoEl.duration;
    }
    let seeking = false;
    progressBar.addEventListener('mousedown', e=>{ seeking=true; seekFromEvent(e); });
    window.addEventListener('mousemove', e=>{ if(seeking) seekFromEvent(e); });
    window.addEventListener('mouseup', ()=>{ seeking=false; });

    btnSkipBack.onclick = ()=> videoEl.currentTime = Math.max(0, videoEl.currentTime-10);
    btnSkipFwd.onclick = ()=> videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime+10);

    volumeRange.oninput = ()=>{ videoEl.volume = parseFloat(volumeRange.value); videoEl.muted=false; };
    videoEl.addEventListener('volumechange', ()=>{
      volumeRange.value = videoEl.muted?0:videoEl.volume;
      if(videoEl.muted||videoEl.volume===0){
        iconVolume.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else if(videoEl.volume<0.5){
        iconVolume.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
      } else {
        iconVolume.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    });
    btnMute.onclick = ()=>{ videoEl.muted = !videoEl.muted; };

    btnSubtitles.onclick = (e)=>{
      e.stopPropagation();
      settingsMenu.classList.remove('open');
      subtitleMenu.classList.toggle('open');
    };
    btnSettings.onclick = (e)=>{
      e.stopPropagation();
      subtitleMenu.classList.remove('open');
      settingsMenu.classList.toggle('open');
    };
    document.addEventListener('click', (e)=>{
      if(!subtitleMenu.contains(e.target) && e.target!==btnSubtitles) subtitleMenu.classList.remove('open');
      if(!settingsMenu.contains(e.target) && e.target!==btnSettings) settingsMenu.classList.remove('open');
    });

    btnFullscreen.onclick = ()=>{
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else wrap.requestFullscreen?.();
    };

    document.addEventListener('keydown', (e)=>{
      if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if(!document.getElementById('view-watch').classList.contains('active')) return;
      switch(e.key){
        case ' ': case 'k': e.preventDefault(); togglePlay(); break;
        case 'ArrowLeft': videoEl.currentTime = Math.max(0, videoEl.currentTime-5); break;
        case 'ArrowRight': videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime+5); break;
        case 'f': btnFullscreen.click(); break;
        case 'm': videoEl.muted = !videoEl.muted; break;
        case 'c': btnSubtitles.click(); break;
      }
    });
  }

  // ===== ROUTER =====
  function handleRoute(){
    const hash = location.hash || '#/';
    const watchMatch = hash.match(/^#\/watch\/([\w-]{11})/);
    if(watchMatch){
      loadWatch(watchMatch[1]);
    } else {
      loadHome();
    }
  }

  async function init(){
    await fetchInvidiousInstances();
    window.addEventListener('hashchange', handleRoute);
    handleRoute();
  }

  return { init, search, goHome, changeInstance, loadHome };
})();

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
