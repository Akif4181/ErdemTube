<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErdemTube</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; text-align: center; }
        input { width: 60%; padding: 12px; font-size: 16px; border-radius: 8px; border: none; outline: none; background: #222; color: #fff; }
        button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #ff0000; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .status { margin-top: 10px; font-size: 13px; color: #888; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; border-radius: 6px; aspect-ratio: 16/9; object-fit: cover; }
        .card h4 { font-size: 14px; margin: 10px 0 5px 0; color: #fff; line-height: 1.4; height: 40px; overflow: hidden; }
        .card p { font-size: 12px; color: #aaa; margin: 0; }
        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; z-index: 999; }
        video { width: 80%; max-width: 800px; border-radius: 8px; }
        .close-btn { margin-top: 15px; background: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔴 ErdemTube</h1>
    <input type="text" id="searchInput" placeholder="Ne izlemek istiyorsun?" onkeypress="if(event.key==='Enter') videoAra()">
    <button onclick="videoAra()">Ara</button>
    <div id="statusText" class="status"></div>

    <div class="grid" id="results"></div>
</div>

<div id="playerModal">
    <video id="videoPlayer" controls autoplay></video>
    <button class="close-btn" onclick="kapatPlayer()">Kapat</button>
</div>

<script>
    // En sağlam ve stabil Piped API sunucuları
    const PIPED_SERVERS = [
        "https://pipedapi.kavin.rocks",
        "https://pipedapi.privacy.com.de",
        "https://api.piped.privacydev.net"
    ];

    async function videoAra() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        const statusText = document.getElementById('statusText');
        resultsDiv.innerHTML = "<p>Videolar aranıyor...</p>";
        statusText.innerText = "";

        let success = false;

        for (let server of PIPED_SERVERS) {
            try {
                const res = await fetch(`${server}/search?q=${encodeURIComponent(query)}&filter=videos`);
                if (!res.ok) continue;

                const data = await res.json();
                const items = data.items || data; // Piped yapısına göre güvenli veri alımı

                if (items && items.length > 0) {
                    resultsDiv.innerHTML = "";
                    items.forEach(item => {
                        // URL'den video ID'sini ayıkla (/watch?v=ABCDE formatından)
                        const videoId = item.url ? item.url.split('v=')[1] : item.videoId;
                        if (!videoId) return;

                        const title = item.title || "İsimsiz Video";
                        const uploader = item.uploaderName || item.uploader || "Bilinmeyen Kanal";
                        const thumbnail = item.thumbnail || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

                        resultsDiv.innerHTML += `
                            <div class="card" onclick="videoAc('${server}', '${videoId}')">
                                <img src="${thumbnail}" loading="lazy">
                                <h4>${title}</h4>
                                <p>${uploader}</p>
                            </div>
                        `;
                    });

                    statusText.innerText = "Bağlantı başarılı!";
                    success = true;
                    break;
                }
            } catch (err) {
                console.log(`${server} hata verdi, sonrakine geçiliyor...`);
            }
        }

        if (!success) {
            resultsDiv.innerHTML = "<p>Arama sırasında bir hata oluştu, lütfen tekrar dene reis!</p>";
            statusText.innerText = "";
        }
    }

    async function videoAc(server, id) {
        const modal = document.getElementById('playerModal');
        const player = document.getElementById('videoPlayer');
        const statusText = document.getElementById('statusText');
        
        statusText.innerText = "Video hazırlanıyor...";

        try {
            const res = await fetch(`${server}/streams/${id}`);
            const data = await res.json();
            
            // Piped üzerindeki en iyi mp4 video akış linkini bul
            let videoUrl = "";
            if (data.videoStreams && data.videoStreams.length > 0) {
                const mp4Stream = data.videoStreams.find(s => s.format === 'MPEG_4' && s.url);
                videoUrl = mp4Stream ? mp4Stream.url : data.videoStreams[0].url;
            }

            if (videoUrl) {
                player.src = videoUrl;
                modal.style.display = 'flex';
                statusText.innerText = "";
            } else {
                alert("Bu videonun akış linki bulunamadı!");
            }
        } catch (err) {
            alert("Video açılırken bir sorun oluştu!");
            statusText.innerText = "";
        }
    }

    function kapatPlayer() {
        const modal = document.getElementById('playerModal');
        const player = document.getElementById('videoPlayer');
        player.pause();
        player.src = "";
        modal.style.display = 'none';
    }
</script>

</body>
</html>
