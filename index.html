<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErdemTube</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; text-align: center; }
        .search-box { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        input { width: 60%; padding: 14px; font-size: 16px; border-radius: 8px; border: none; outline: none; background: #222; color: #fff; }
        button { padding: 14px 24px; font-size: 16px; border-radius: 8px; border: none; background: #ff0000; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; border-radius: 6px; aspect-ratio: 16/9; object-fit: cover; }
        .card h4 { font-size: 14px; margin: 10px 0 5px 0; color: #fff; line-height: 1.4; height: 40px; overflow: hidden; }
        .card p { font-size: 12px; color: #888; margin: 0; }
        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; flex-direction: column; z-index: 999; }
        iframe { width: 85%; height: 70vh; max-width: 900px; border: none; border-radius: 8px; }
        .close-btn { margin-top: 15px; background: #555; padding: 10px 20px; border-radius: 6px; color: #fff; border: none; cursor: pointer; font-size: 15px; }
        .close-btn:hover { background: #777; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔴 ErdemTube</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ne izlemek istiyorsun?" onkeypress="if(event.key==='Enter') videoAra()">
        <button onclick="videoAra()">Ara</button>
    </div>
    <div id="statusText" class="status"></div>

    <div class="grid" id="results"></div>
</div>

<div id="playerModal">
    <iframe id="videoPlayer" allowfullscreen allow="autoplay"></iframe>
    <button class="close-btn" onclick="kapatPlayer()">Videoyu Kapat</button>
</div>

<script>
    // ANAHTARINI BURAYA YAPIŞTIR (Tırnakları silme, sadece içini değiştir):
    const API_KEY = "BURAYA_YAPIŞTIR";

    async function videoAra() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        const statusText = document.getElementById('statusText');
        
        resultsDiv.innerHTML = "";
        statusText.innerText = "Videolar getiriliyor...";

        try {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();

            if (data.error) {
                statusText.innerText = "API Hatası: " + data.error.message;
                return;
            }

            if (data.items && data.items.length > 0) {
                resultsDiv.innerHTML = "";
                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumbnail = item.snippet.thumbnails.high.url;

                    resultsDiv.innerHTML += `
                        <div class="card" onclick="videoAc('${videoId}')">
                            <img src="${thumbnail}" loading="lazy">
                            <h4>${title}</h4>
                            <p>${channel}</p>
                        </div>
                    `;
                });
                statusText.innerText = `${data.items.length} video bulundu!`;
            } else {
                statusText.innerText = "Sonuç bulunamadı.";
            }

        } catch (err) {
            statusText.innerText = "Bağlantı hatası oluştu, tekrar dene!";
        }
    }

    function videoAc(id) {
        const modal = document.getElementById('playerModal');
        const player = document.getElementById('videoPlayer');
        
        player.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
        modal.style.display = 'flex';
    }

    function kapatPlayer() {
        const modal = document.getElementById('playerModal');
        const player = document.getElementById('videoPlayer');
        player.src = "";
        modal.style.display = 'none';
    }
</script>

</body>
</html>
